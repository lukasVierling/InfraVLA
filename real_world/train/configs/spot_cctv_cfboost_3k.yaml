# ============================================================================
# Real-robot CCTV arm (InfraVLA): ego + two fixed CCTV views (camera3, camera4).
#
# Mirrors the simulation language recipe so the real-robot result is
# comparable to it:
#   * modality_list [7, 4, 5, 6] + modality_weights [0.8, ...] -> language is
#     80% of samples (a flat draw over the ids would give language ~40%).
#   * final_goal_prob 0.5 - half the samples use the take's last frame as the
#     goal (the robot standing at the target); this teaches goal-reaching
#     rather than short-horizon continuation.
#   * max_goal_distance_steps 300 - takes are only ~60 frames, so this means
#     "any frame in the take".
#   * cctv_downsample avgpool -> 64 tokens per CCTV view; two undownsampled
#     views (2x256 tokens) nearly fill a 95 GB GPU.
#   * use_cctv_encoder false - CCTV goes through the shared ego encoder.
#   * batch 5 x accum 6 = 30 effective.
#
# Counterfactual-window upsampling (cf_window_balance) uses yaw_eps_deg 8.0
# instead of sim's 1.0: twin headings on the real rig differ by 1.9 deg median
# and 4.1 deg p90 at t=0, so 1.0 deg is below the hardware's repeatability.
#
# Spacing 0.19 m: per-tick (1/3 s) displacement peaks at ~0.19 m, i.e. the
# max recorded speed (~0.57 m/s). Serving must use the same spacing;
# merge_lora_for_serving.py records it in serving.json and serve_spot_ft.sh
# enforces it.
#
# Held-out val: 5 complete families (05, 09, 12, 16, 23), held out whole so no
# val take has a sibling of the same object from the same spot in train.
# ============================================================================

run:
  name: "2026-08-21_spot_cctv_cfboost_v0"
  notes: "Real-robot CCTV arm (camera3 + camera4, avgpool64, 80% language, spacing 0.19) with counterfactual-window upsampling, resumed from step 2000 to 3000."

model:
  vla_path: "${INFRAVLA_ROOT}/omnivla-original"
  pretrained_step: 120000
  num_images_in_input: 4          # ego obs + ego goal + camera3 + camera4
  num_ego_images: 2
  use_cctv_encoder: false         # sim: CCTV through the SHARED ego encoder
  cctv_downsample:                # sim: 256 -> 64 tokens per CCTV view
    method: avgpool
    out_tokens: 64
  downsample_ego: false
  use_lora: true
  lora_rank: 16
  lora_alpha: 8
  lora_dropout: 0.0

data:
  train_dir: "${INFRAVLA_ROOT}/runs/data/real_world/spot_cctv_2026_08_21_sp019_all/train"
  val_dir:   "${INFRAVLA_ROOT}/runs/data/real_world/spot_cctv_2026_08_21_sp019/val"
  test_dir:  "${INFRAVLA_ROOT}/runs/data/real_world/spot_cctv_2026_08_21_sp019/val"

  max_train_trajectories: null
  max_val_trajectories:   null
  max_test_trajectories:  null

  num_actions_chunk: 8
  context_size: 5

  modality_list: [7, 4, 5, 6]                        # sim order; language FIRST
  modality_weights: [0.8, 0.06667, 0.06667, 0.06666] # -> 80% language
  image_only_max_distance_steps: 10

  min_goal_distance_steps: 1
  max_goal_distance_steps: 300    # sim value; here effectively "any frame"
  final_goal_prob: 0.5            # sim value; half the goals are the target

  predict_stop_token: true
  metric_waypoint_spacing: 0.19   # max recorded speed 0.578 m/s / 3 Hz
  waypoint_spacing: 1
  image_size: [224, 224]
  goals_per_obs: 1

  emit_cctv: true
  cctv_cam_names: [camera3, camera4]
  no_goal_image: false
  use_cctv_goal: false

  # --- emphasis knobs, written out explicitly ---------------------------------
  random_hflip: false             # REQUIRED off with fixed external cameras
  perception_dropout:     [1.0, 0.0, 0.0]
  val_perception_dropout: [1.0, 0.0, 0.0]
  cctv_cam_dropout: 0.0
  cctv_blockade_signal: false
  ego_blackout: false
  counterfactual_windows: {enabled: false}
  cf_window_balance:
    enabled: true
    criterion: yaw
    yaw_eps_deg: 8.0      # sim uses 1.0; real twin heading repeatability is ~4.1 deg p90
    pre_steps: 3          # sim values: window = [t*-3 .. t*], per pair, unioned
    post_steps: 0
    dev_thresh_m: 0.75    # unused by the yaw criterion; key required
    boost: 4.0            # ~28 pct effective mass (sim 16.6 -> ~62 pct)
  cf_onboard_swap:        {enabled: false}
  cf_onboard_swap_extra:  {enabled: false}
  curvature_balance:      {enabled: false}
  dataset_manager:        {enabled: false}

train:
  batch_size: 5                   # sim
  grad_accumulation_steps: 6      # sim -> effective 30
  learning_rate: 1.0e-4
  num_steps_before_decay: 100000
  lr_decay_gamma: 0.1
  max_steps: 3000
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8
  seed: 42
  num_workers: 4

loss:
  smoothness_weight: 0.1
  obj_weight: 0.0                 # obj_pose_norm is zeros in this export

val:
  val_freq: 250                   # finer than sim's 500 to locate the overfit knee
  max_samples: null

checkpoint:
  save_freq: 250
  keep_top_k: 3
  keep_latest: true
  keep_every_n_steps: 5000

logging:
  wandb_entity: ""
  wandb_project: "infravla"
  wandb_tags: ["real-robot", "spot", "cctv", "camera3", "camera4", "2026-08-21",
               "spacing0.19", "heldout-val", "langsim", "lang80", "avgpool64"]
  log_freq: 25

extensibility:
  extra_obs_modalities: []
  extra_goal_modalities: []

output:
  runs_root: "${INFRAVLA_ROOT}/runs/training/real_world"
