# ============================================================================
# Semantic task (langv2) -- stage 2 (InfraVLA).
# Resumes stage 1 (2026-07-23_cctv4_avgpool64_langv2_yawcrux_pre3) at
# step 15000 (full state, lr 1e-4) and fine-tunes +5k steps to 20000.
# DatasetManager mix: yaw decision-window view (pre 3 / post 0) at mass 0.8 +
# 48 recovery trajectories self-mined from the parent checkpoint on its own
# train split (mass 0.2); recovery-only anchors, 0.05 m rejoin rule.
# ============================================================================

run:
  name: "2026-08-11_langv2_A0_dmrecext2_N48_ft20k_v0"
  notes: "Semantic task (langv2) stage 2: resume stage 1 at step 15000 and fine-tune 5k steps on decision windows plus 48 self-mined recovery trajectories."
model:
  vla_path: "${INFRAVLA_ROOT}/omnivla-original"
  pretrained_step: 120000
  num_images_in_input: 6
  use_cctv_encoder: true
  num_ego_images: 2
  cctv_downsample:
    method: avgpool
    out_tokens: 64
  use_lora: true
  lora_rank: 16
  lora_alpha: 8
  lora_dropout: 0.0
data:
  train_dir: "${INFRAVLA_ROOT}/runs/data/splits/2026-07-22_warehouse_2x3_langv2/train"
  val_dir:   "${INFRAVLA_ROOT}/runs/data/splits/2026-07-22_warehouse_2x3_langv2/val"
  test_dir:  "${INFRAVLA_ROOT}/runs/data/splits/2026-07-22_warehouse_2x3_langv2/val"  # unused during training
  max_train_trajectories: null
  max_val_trajectories:   null
  max_test_trajectories:  null
  num_actions_chunk: 8
  context_size: 5
  modality_list: [7, 4, 5, 6]
  # 80% language-only (id 7); id 8 excluded — the pose goal differs between
  # twins, so language+pose would leak the answer past the instruction.
  modality_weights: [0.8, 0.06667, 0.06667, 0.06666]
  lang_manifest: "${INFRAVLA_ROOT}/isaac_sim/configs/experiment/datagen_2x3_langv2_all_manifest.json"
  lang_pattern: "move toward the {x}"
  image_only_max_distance_steps: 10
  min_goal_distance_steps: 1
  max_goal_distance_steps: 300
  final_goal_prob: 0.5
  predict_stop_token: true
  metric_waypoint_spacing: 0.333
  waypoint_spacing: 1
  image_size: [224, 224]
  random_hflip: false
  goals_per_obs: 1
  emit_cctv: true
  cctv_cam_names: [cctv_NE, cctv_NW, cctv_SE, cctv_SW]
  no_goal_image: false
  use_cctv_goal: false
  perception_dropout:     [1.0, 0.0, 0.0]
  val_perception_dropout: [1.0, 0.0, 0.0]
  # --- DatasetManager mix (replaces the parent's cf_window_balance boost) ---
  # Masses are dataset-mass shares: cf 1.0 + recovery 0.25 -> 80/20 draws.
  # normal_weight 0.0 = derivation-only (cf view + recovery kwargs derive from
  # it; it contributes no samples) — same recipe as the spatial stage 2.
  # criterion=yaw pre3/post0 selects the same frames the parent's
  # cf_window_balance upweighted.
  dataset_manager:
    enabled: true
    normal_weight: 0.0
    counterfactual:
      enabled: true
      weight: 1.0
      criterion: yaw          # parent's yaw window, not the spatial 16/8 distance window
      yaw_eps_deg: 1.0
      pre_steps: 3            # window = [crux-3, crux], all pre-divergence
      post_steps: 0           # >0 reaches past the crux into leaked frames
      dev_thresh_m: 0.75      # unused under yaw; kept so the key exists
    recovery:
      enabled: true
      weight: 0.25
      traj_root: "${INFRAVLA_ROOT}/runs/data/recovery/2026-08-11_A015k_langv2_recovery_t05_N48"
      # Anchor rule: recovery-only anchors (prefix = obs history, never
      # anchored), span = handoff .. first frame within 0.05 m of the
      # original plan (no sustain), min 1.
      anchor_rejoin: {eps_m: 0.05}
  # --- cf-val side channel: identical to the parent's block (distance
  # criterion, pre 6 / post 0) so val_cf/* stays comparable to the parent's
  # logged curve.
  cf_val_report:
    enabled: true
    pre_steps: 6
    post_steps: 0
    dev_thresh_m: 0.75
train:
  batch_size: 5
  grad_accumulation_steps: 6
  learning_rate: 1.0e-4
  num_steps_before_decay: 100000
  lr_decay_gamma: 0.1
  max_steps: 20000          # resume step_15000 -> +5k fine-tune steps
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8
  seed: 42
loss:
  smoothness_weight: 0.1
  obj_weight: 0.0
val:
  val_freq: 250             # tight overfit watch (~50 recovery trajs repeat fast)
  max_samples: null
checkpoint:
  save_freq: 1000
  keep_top_k: 3
  keep_latest: true
  keep_every_n_steps: 5000
logging:
  wandb_entity: ""
  wandb_project: "infravla"
  wandb_tags: ["cctv_exp", "warehouse_2x3_cfv4", "aspawn_only", "fixed_heading", "souththird_forklift", "bigcam", "cctv4", "avgpool64", "fg50", "nohflip", "r16", "yawcrux", "langv2", "lang80", "movetoward", "pairingholdout", "noforkliftB", "dm_recovery_ft", "dmrecext2", "recovery", "ft18k"]
  log_freq: 10
extensibility:
  extra_obs_modalities: []
  extra_goal_modalities: []
output:
  runs_root: "${INFRAVLA_ROOT}/runs/training/runs"
