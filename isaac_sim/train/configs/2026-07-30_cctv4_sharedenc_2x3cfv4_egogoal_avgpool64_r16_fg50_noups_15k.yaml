# ============================================================================
# Spatial task (cfv4) -- no-upsampling ablation.
# Identical to stage 1 (2026-07-11_cctv4_sharedenc_2x3cfv4_egogoal_avgpool64_r16_fg50_cfwinboost8_15k)
# except cf_window_balance is disabled (uniform sampling over the train set).
# cf_val_report stays on for curve comparability. 15k steps from scratch.
# ============================================================================

run:
  name: "2026-07-30_cctv4_sharedenc_2x3cfv4_egogoal_avgpool64_r16_fg50_noups_15k_v0"
  notes: "Spatial task (cfv4) no-upsampling ablation: stage-1 recipe without decision-window upweighting, 15k steps from scratch."

model:
  vla_path: "${INFRAVLA_ROOT}/omnivla-original"
  pretrained_step: 120000
  num_images_in_input: 6
  use_cctv_encoder: true
  num_ego_images: 2
  cctv_downsample:
    method: avgpool
    out_tokens: 64
  use_lora: true
  lora_rank: 16
  lora_alpha: 8
  lora_dropout: 0.0

data:
  train_dir: "${INFRAVLA_ROOT}/runs/data/splits/2026-07-11_warehouse_2x3_cfv4/train"
  val_dir:   "${INFRAVLA_ROOT}/runs/data/splits/2026-07-11_warehouse_2x3_cfv4/val"
  test_dir:  "${INFRAVLA_ROOT}/runs/data/splits/2026-07-11_warehouse_2x3_cfv4/test"

  max_train_trajectories: null
  max_val_trajectories:   null
  max_test_trajectories:  null

  num_actions_chunk: 8
  context_size: 5

  modality_list: [4, 5, 6]
  image_only_max_distance_steps: 10

  min_goal_distance_steps: 1
  max_goal_distance_steps: 300

  final_goal_prob: 0.5

  predict_stop_token: true
  metric_waypoint_spacing: 0.333
  waypoint_spacing: 1
  image_size: [224, 224]
  random_hflip: false
  goals_per_obs: 1

  emit_cctv: true

  cctv_cam_names: [cctv_NE, cctv_NW, cctv_SE, cctv_SW]
  no_goal_image: false
  use_cctv_goal: false
  perception_dropout:     [1.0, 0.0, 0.0]
  val_perception_dropout: [1.0, 0.0, 0.0]

  # --- CF-window upweighted sampling (train only) ---
  # Full dataset + WeightedRandomSampler: in-window samples get weight `boost`,
  # the rest 1.0. Windows are mined by mine_cf_windows.
  cf_window_balance:
    enabled: false          # NO counterfactual upsampling — this arm is the control
    pre_steps: 16           # (knobs kept so the block documents what is switched off)
    post_steps: 8
    dev_thresh_m: 0.75
    boost: 8.0

  # --- cf-val side channel: report loss on the decision-window val subset ---
  # (val_cf/* in wandb) alongside the full val each val_freq. Reporting only —
  # best-checkpoint selection stays on the full val. Same knobs as the sampler
  # so "crux" means the same thing in train weighting and val reporting.
  cf_val_report:
    enabled: true
    pre_steps: 16
    post_steps: 8
    dev_thresh_m: 0.75

train:
  batch_size: 5
  grad_accumulation_steps: 6
  learning_rate: 1.0e-4
  num_steps_before_decay: 100000
  lr_decay_gamma: 0.1
  max_steps: 15000
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8
  seed: 42

loss:
  smoothness_weight: 0.1
  obj_weight: 0.1

val:
  val_freq: 500
  max_samples: null

checkpoint:
  save_freq: 1000
  keep_top_k: 3
  keep_latest: true
  keep_every_n_steps: 5000

logging:
  wandb_entity: ""
  wandb_project: "infravla"
  wandb_tags: ["cctv_exp", "warehouse_2x3_cfv4", "aspawn_only", "fixed_heading", "souththird_forklift", "bigcam", "cctv4", "avgpool64", "fg50", "nohflip", "r16", "noupsampling", "cfval", "15k", "progression_control"]
  log_freq: 10

extensibility:
  extra_obs_modalities: []
  extra_goal_modalities: []

output:
  runs_root: "${INFRAVLA_ROOT}/runs/training/runs"
