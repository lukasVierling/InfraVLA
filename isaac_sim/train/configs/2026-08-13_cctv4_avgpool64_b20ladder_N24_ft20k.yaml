# ============================================================================
# Spatial task (cfv4) -- stage 2, recovery ladder K=24.
# Resumes stage 1 (2026-07-11_cctv4_sharedenc_2x3cfv4_egogoal_avgpool64_r16_fg50_cfwinboost8_15k)
# at step 15000 (full state, lr 1e-4) and fine-tunes +5k steps to 20000.
# DatasetManager mix: decision-window view (distance criterion, [t*-16, t*+8])
# at mass 0.8 + the first 24 of 48 self-mined recovery trajectories (nested
# subsets, extended to the original goal) at mass 0.2; final_goal_prob 1.0.
# ============================================================================

run:
  name: "2026-08-13_cctv4_avgpool64_b20ladder_N24_ft20k_v0"
  notes: "Spatial task (cfv4) stage 2, recovery ladder K=24: resume stage 1 at step 15000 and fine-tune 5k steps on decision windows plus 24 self-mined recovery trajectories."

model:
  vla_path: "${INFRAVLA_ROOT}/omnivla-original"
  pretrained_step: 120000
  num_images_in_input: 6
  use_cctv_encoder: true
  num_ego_images: 2
  cctv_downsample:
    method: avgpool
    out_tokens: 64
  use_lora: true
  lora_rank: 16
  lora_alpha: 8
  lora_dropout: 0.0

data:
  train_dir: "${INFRAVLA_ROOT}/runs/data/splits/2026-07-11_warehouse_2x3_cfv4/train"
  val_dir:   "${INFRAVLA_ROOT}/runs/data/splits/2026-07-11_warehouse_2x3_cfv4/val"
  test_dir:  "${INFRAVLA_ROOT}/runs/data/splits/2026-07-11_warehouse_2x3_cfv4/test"

  max_train_trajectories: null
  max_val_trajectories:   null
  max_test_trajectories:  null

  num_actions_chunk: 8
  context_size: 5

  modality_list: [4, 5, 6]
  image_only_max_distance_steps: 10

  min_goal_distance_steps: 1
  max_goal_distance_steps: 300

  # 1.0: goals are always the final frame. Recovery trajectories are extended
  # to the original goal, so their goal matches deployment.
  final_goal_prob: 1.0

  predict_stop_token: true
  metric_waypoint_spacing: 0.333
  waypoint_spacing: 1
  image_size: [224, 224]
  random_hflip: false
  goals_per_obs: 1

  emit_cctv: true

  cctv_cam_names: [cctv_NE, cctv_NW, cctv_SE, cctv_SW]
  no_goal_image: false
  use_cctv_goal: false
  perception_dropout:     [1.0, 0.0, 0.0]
  val_perception_dropout: [1.0, 0.0, 0.0]

  # --- DatasetManager mix (replaces cf_window_balance) ---
  # Masses are dataset-mass shares (weight_d / sum(weights) of total sampling
  # mass, regardless of entry size). normal_weight 0.0 = derivation-only (the
  # cf view + recovery kwargs derive from it; it contributes no samples).
  # cf 1.0 + recovery 0.25 -> 80/20 draws.
  dataset_manager:
    enabled: true
    normal_weight: 0.0
    counterfactual:
      enabled: true
      weight: 1.0
      pre_steps: 16
      post_steps: 8
      dev_thresh_m: 0.75
    recovery:
      enabled: true
      weight: 0.25
      traj_root: "${INFRAVLA_ROOT}/runs/data/recovery/2026-08-13_avgpool15k_cfv4_b20_N48/subset_N24"
      # Anchor rule: recovery-only anchors (the failure prefix is observation
      # history only, never supervised — it would supervise the drift and
      # contradict cf-window labels); span = handoff .. first frame within
      # 0.05 m of the original plan (no sustain), min 1.
      anchor_rejoin: {eps_m: 0.05}

  # cf-val side channel (parent-style): main val stays the FULL set for
  # comparability; window-restricted val logged as cf_val/*.
  cf_val_report:
    enabled: true
    pre_steps: 16
    post_steps: 8
    dev_thresh_m: 0.75

train:
  batch_size: 5
  grad_accumulation_steps: 6
  learning_rate: 1.0e-4
  num_steps_before_decay: 100000
  lr_decay_gamma: 0.1
  max_steps: 20000          # resume step_15000 -> +5k fine-tune steps
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8
  seed: 42

loss:
  smoothness_weight: 0.1
  obj_weight: 0.1

val:
  val_freq: 250             # tight overfit watch (small recovery pool repeats fast)
  max_samples: null

checkpoint:
  save_freq: 500            # catch the pre-overfit peak
  keep_top_k: 99
  keep_latest: true
  keep_every_n_steps: 500   # keep every fine-tune checkpoint for post-hoc selection

logging:
  wandb_entity: ""
  wandb_project: "infravla"
  wandb_tags: ["cctv_exp", "warehouse_2x3_cfv4", "aspawn_only", "fixed_heading", "souththird_forklift", "bigcam", "cctv4", "avgpool64", "fg100", "nohflip", "r16", "dm_recovery_ft", "extgoal", "20k"]
  log_freq: 10

extensibility:
  extra_obs_modalities: []
  extra_goal_modalities: []

output:
  runs_root: "${INFRAVLA_ROOT}/runs/training/runs"
