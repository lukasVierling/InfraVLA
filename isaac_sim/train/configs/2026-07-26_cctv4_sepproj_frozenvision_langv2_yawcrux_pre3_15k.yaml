# ============================================================================
# Semantic task (langv2) -- ablation: frozen ego vision only.
# Stage-1 recipe (2026-07-23_cctv4_avgpool64_langv2_yawcrux_pre3) with
# freeze_vision and a separate CCTV projector; the LLM (LoRA), CCTV stream and
# heads all train. 15k steps from scratch.
# ============================================================================

run:
  name: "2026-07-26_cctv4_sepproj_frozenvision_langv2_yawcrux_pre3_15k_v0"
  notes: "Semantic task (langv2) ablation: stage-1 recipe with the ego vision encoder and projector frozen (LLM still trained), 15k steps from scratch."

model:
  vla_path: "${INFRAVLA_ROOT}/omnivla-original"
  pretrained_step: 120000
  num_images_in_input: 6
  use_cctv_encoder: true
  num_ego_images: 2
  cctv_downsample:
    method: avgpool
    out_tokens: 64
  # CCTV gets its OWN vision->LLM translator MLP (deepcopy of the ego projector,
  # then its own LoRA) so it stays TRAINABLE when the ego projector is frozen.
  separate_cctv_projector: true
  cctv_cam_embed: false
  # FREEZE LEVEL 1: freeze the ego vision encoder + ego projector (no LoRA
  # there). The LLM (LoRA), CCTV stream and heads adapt.
  freeze_vision: true
  freeze_llm: false   # ABLATION vs frozen-backbone: LLM ADAPTS (isolates the LLM-freeze axis)
  use_lora: true
  lora_rank: 16
  lora_alpha: 8
  lora_dropout: 0.0

data:
  train_dir: "${INFRAVLA_ROOT}/runs/data/splits/2026-07-22_warehouse_2x3_langv2/train"
  val_dir:   "${INFRAVLA_ROOT}/runs/data/splits/2026-07-22_warehouse_2x3_langv2/val"
  test_dir:  "${INFRAVLA_ROOT}/runs/data/splits/2026-07-22_warehouse_2x3_langv2/val"  # no test split; val reused (unused during training)

  max_train_trajectories: null
  max_val_trajectories:   null
  max_test_trajectories:  null

  num_actions_chunk: 8
  context_size: 5

  modality_list: [7, 4, 5, 6]
  # 80% language-only (id 7); id 8 excluded — the pose goal differs between
  # twins, so language+pose would leak the answer past the instruction.
  modality_weights: [0.8, 0.06667, 0.06667, 0.06666]
  lang_manifest: "${INFRAVLA_ROOT}/isaac_sim/configs/experiment/datagen_2x3_langv2_all_manifest.json"
  lang_pattern: "move toward the {x}"   # single LeLaN-style instruction template
  image_only_max_distance_steps: 10

  min_goal_distance_steps: 1
  max_goal_distance_steps: 300

  final_goal_prob: 0.5

  predict_stop_token: true
  metric_waypoint_spacing: 0.333
  waypoint_spacing: 1
  image_size: [224, 224]
  random_hflip: false
  goals_per_obs: 1

  emit_cctv: true

  cctv_cam_names: [cctv_NE, cctv_NW, cctv_SE, cctv_SW]
  no_goal_image: false
  use_cctv_goal: false
  perception_dropout:     [1.0, 0.0, 0.0]
  val_perception_dropout: [1.0, 0.0, 0.0]

  # --- CF-window upweighted sampling (train only) ---
  # Full dataset + WeightedRandomSampler: in-window samples get weight `boost`,
  # the rest 1.0. Windows are mined by mine_cf_windows.
  cf_window_balance:
    enabled: true
    criterion: yaw          # crux = LAST frame before the twins' headings split
    yaw_eps_deg: 1.0        # tolerance; oracle plans carry ~1e-3 deg of noise
    pre_steps: 3            # window = [crux-3, crux] — 4 frames, all pre-divergence
    post_steps: 0           # >0 reaches PAST the crux into leaked frames
    dev_thresh_m: 0.75      # unused under criterion=yaw; kept so the key exists
    boost: 16.6        # ~50/50 window:rest sampling mass (1612 of 28305 samples in-window)

  # --- cf-val side channel: report loss on the decision-window val subset ---
  # (val_cf/* in wandb) alongside the full val each val_freq. Reporting only —
  # best-checkpoint selection stays on the full val. Uses the default distance
  # criterion (pre 6 / post 0), not the sampler's yaw window.
  cf_val_report:
    enabled: true
    pre_steps: 6
    post_steps: 0
    dev_thresh_m: 0.75

train:
  batch_size: 5
  grad_accumulation_steps: 6
  learning_rate: 1.0e-4
  num_steps_before_decay: 100000
  lr_decay_gamma: 0.1
  max_steps: 15000
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8
  seed: 42

loss:
  smoothness_weight: 0.1
  # 0.0, not LeLaN's 0.1: their obj loss asserts the FINAL waypoint lands on the
  # target object, which holds for their short object-approach clips. Our 8-wp
  # long-horizon chunks end mid-corridor, and obj_pose_norm is a hardcoded (0,0)
  # dummy -> the term degenerates to a shrinkage penalty on w8's dx,dy.
  obj_weight: 0.0

val:
  val_freq: 500
  max_samples: null

checkpoint:
  save_freq: 1000
  keep_top_k: 3
  keep_latest: true
  keep_every_n_steps: 5000

logging:
  wandb_entity: ""
  wandb_project: "infravla"
  wandb_tags: ["cctv_exp", "warehouse_2x3_cfv4", "aspawn_only", "fixed_heading", "souththird_forklift", "bigcam", "cctv4", "avgpool64", "fg50", "nohflip", "r16", "cfwinboost8", "cfval", "15k", "yawcrux", "langv2", "lang80", "movetoward", "sepproj", "frozenvision", "freezelvl1", "egofirst"]
  log_freq: 10

extensibility:
  extra_obs_modalities: []
  extra_goal_modalities: []

output:
  runs_root: "${INFRAVLA_ROOT}/runs/training/runs"
