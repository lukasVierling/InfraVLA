# ============================================================================
# Spatial task (cfv4) -- ego-only baseline (no CCTV input), 15k steps from scratch.
# Same data, decision-window upsampling (cf_window_balance boost 8) and
# schedule as stage 1 (2026-07-11_cctv4_sharedenc_2x3cfv4_egogoal_avgpool64_r16_fg50_cfwinboost8_15k),
# with the CCTV path removed: 2 ego images, emit_cctv=false. Effective batch
# 10 x 3 = 30, matching the CCTV run's 5 x 6.
# ============================================================================

run:
  name: "2026-07-11_baseline_egoonly_2x3cfv4_r16_fg50_cfwinboost8_15k_v0"
  notes: "Spatial task (cfv4) ego-only baseline: no CCTV input, decision-window upsampling (boost 8), 15k steps from scratch."

model:
  vla_path: "${INFRAVLA_ROOT}/omnivla-original"
  pretrained_step: 120000
  num_images_in_input: 2
  num_ego_images: 2          # required by the v2 loader; all inputs are ego here
                             # (use_cctv_encoder unset -> ego-only path).
  use_lora: true
  lora_rank: 16
  lora_alpha: 8
  lora_dropout: 0.0

data:
  # cfv4 ego-only split: same trajectory membership as the CCTV split, without
  # the cctv_* directories (never read with emit_cctv=false). Built by
  # scripts/train/launch_cfwinboost8_egoonly.sh.
  train_dir: "${INFRAVLA_ROOT}/runs/data/splits/2026-07-11_warehouse_2x3_cfv4_egoonly/train"
  val_dir:   "${INFRAVLA_ROOT}/runs/data/splits/2026-07-11_warehouse_2x3_cfv4_egoonly/val"
  test_dir:  "${INFRAVLA_ROOT}/runs/data/splits/2026-07-11_warehouse_2x3_cfv4_egoonly/test"

  max_train_trajectories: null
  max_val_trajectories:   null
  max_test_trajectories:  null

  num_actions_chunk: 8
  context_size: 5

  modality_list: [4, 5, 6]
  image_only_max_distance_steps: 10

  min_goal_distance_steps: 1
  max_goal_distance_steps: 300

  final_goal_prob: 0.5

  predict_stop_token: true
  metric_waypoint_spacing: 0.333
  waypoint_spacing: 1
  image_size: [224, 224]
  random_hflip: false
  goals_per_obs: 1

  emit_cctv: false

  # --- CCTV-pipeline knobs (let this baseline run via the cctv trainer) ---
  # With emit_cctv=false these keep it pure 2-image ego-only.
  use_cctv_goal: false
  perception_dropout:     [1.0, 0.0, 0.0]
  val_perception_dropout: [1.0, 0.0, 0.0]

  # --- CF-window upweighted sampling (same as the CCTV stage-1 run) ---
  # Full dataset + WeightedRandomSampler: in-window samples get weight `boost`,
  # the rest 1.0. Mining is trajectory-position-based (twin divergence), so it
  # is modality-independent — identical windows to the CCTV run.
  cf_window_balance:
    enabled: true
    pre_steps: 16
    post_steps: 8
    dev_thresh_m: 0.75
    boost: 8.0

  # --- cf-val side channel: cfv4 decision-window val subset, deterministic
  # seeding (seed+1) -> val_cf/* comparable to the CCTV run.
  cf_val_report:
    enabled: true
    pre_steps: 16
    post_steps: 8
    dev_thresh_m: 0.75

train:
  batch_size: 10
  grad_accumulation_steps: 3          # effective batch = 30 — matches the CCTV
                                      # run (5x6).
  learning_rate: 1.0e-4
  num_steps_before_decay: 100000
  lr_decay_gamma: 0.1
  max_steps: 15000
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8
  seed: 42

loss:
  smoothness_weight: 0.1
  obj_weight: 0.1

val:
  val_freq: 500
  max_samples: null

checkpoint:
  save_freq: 1000
  keep_top_k: 3
  keep_latest: true
  keep_every_n_steps: 5000

logging:
  wandb_entity: ""
  wandb_project: "infravla"
  wandb_tags: ["cctv_exp", "warehouse_2x3_cfv4", "aspawn_only", "fixed_heading", "souththird_forklift", "baseline", "ego_only", "fg50", "nohflip", "r16", "cfwinboost8", "cfval", "15k"]
  log_freq: 10

extensibility:
  extra_obs_modalities: []
  extra_goal_modalities: []

output:
  runs_root: "${INFRAVLA_ROOT}/runs/training/runs"
