# ============================================================================
# 2x3 warehouse LANGUAGE-goal data-gen — v1 EXTENSION batch "langv1c".
# ============================================================================
# Read directly by run_builders/build_2x3_lang.py (OmegaConf.load). SAME
# generation semantics as datagen_2x3_lang.yaml (v1: all 6 non-D zones, 5-kind
# pool incl. cart, distractor_prob draw, 2 twins tA/tB per family) — only the
# batch bookkeeping differs. Purpose: top up the recorded v1 set (304 traj as
# of 2026-07-22: 241 langv1 + 63 langv1b) by 148 families x 2 = 296 -> 600
# total, matching the langv2 campaign size (Lukas 2026-07-22).
#
# Bookkeeping deltas vs datagen_2x3_lang.yaml (which stays untouched):
#   n_families 148, base_seed 45000, name_start_index 210. Everything below
#   the batch-size block is a byte-for-byte copy of the v1 knobs.
# Seed ranges already burned (a reused seed would DUPLICATE placements of an
# existing family): 40000+ (langv1, 125 fams), 42000+ (langv1b, 42 fams),
# 43000+ (langv2, 150 fams). 45000 is fresh with margin.
# Name indices 0000-0209 exist on disk; 0210+ cannot collide.
# ============================================================================

# --- batch size -------------------------------------------------------------
n_families: 148             # x2 twins = 296 new traj; 304 recorded + 296 = 600
base_seed: 45000            # fresh range, see header
name_start_index: 210       # existing v1 scenes end at 0209
partition_size: 8           # 4 two-twin families per partition (8 % 2 == 0);
                            # keep < ~20 (Isaac env-reload-leak threshold)
max_steps: 120              # unchanged from v1

# --- object pool (v1: all 5 kinds, cart INCLUDED) ---------------------------
pool:
  - { kind: forklift,     variant: 0 }   # half 0.61 x 1.75  (elongated; yaw=0 -> along aisle)
  - { kind: cart,         variant: 0 }   # half 0.47 x 0.82
  - { kind: barrel,       variant: 0 }   # half 0.30 x 0.35  (radius 0.46)
  - { kind: box,          variant: 0 }   # SM_CardBoxA_01 (closed), half 0.35 x 0.25
  - { kind: traffic_cone, variant: 0 }   # S_TrafficCone.usd, footprint HAND value

# --- footprint overrides (kinds with no MEASURED footprint) -----------------
footprint_overrides:
  traffic_cone:
    "0": { half_w: 0.15, half_d: 0.15, radius: 0.21 }

# --- zones (v1: every zone except D) ----------------------------------------
object_zones: [A, B, C, E, F, G]
spawn_zone: D
distractor_prob: 0.5

# --- spawn pose (v1) --------------------------------------------------------
spawn:
  mode: west_wall
  wall_buffer_m: 0.5
  heading_deg: 0
  heading_mode: fixed

# --- placement geometry (v1: full aisle band) -------------------------------
placement:
  aisle_end_margin_m: 1.0
  open_margin_m: 0.8
  clearance_margin_m: 0.15
  max_tries: 50

# --- language instruction (v1) ----------------------------------------------
lang:
  patterns:
    - "go to the {x}"
    - "move toward the {x}"
    - "navigate to the {x}"
  phrases:
    forklift: forklift
    cart: cart
    barrel: barrel
    box: box
    traffic_cone: traffic cone

# --- goal / target (v1) -----------------------------------------------------
goal_clear_radius_m: 0.6
forklift_aisle_yaw_deg: 0
lighting: [normal]

# --- robot + static map -----------------------------------------------------
robot:
  inflation_m: 0.35
astar_config: warehouse_2x3

# --- render ------------------------------------------------------------------
camera_set: with_4cctv_2x3_bigcam
