# ============================================================================
# 2x3 warehouse cf data-gen — v2 "FORWARD-HEADING, NO-DISTRACTOR" campaign.
# ============================================================================
# Second counterfactual campaign (2026-07-04). Same cf machinery as
# datagen_2x3.yaml (superset-then-delete forklift families, A/D/G open zones +
# no_adjacent, route-aware seal, A* gate) with EXACTLY two deliberate changes,
# both aimed at cleaning the learnable signal without leaking the crux:
#
#   1. NO DISTRACTORS  (distractors.count_probs + counterfactual.aisle_distractor
#      _count_probs both -> [1.0] = 0). The small box/barrel/cart clutter hurt
#      testing and plausibly muddied learning; the forklift BLOCKER (the cf crux)
#      is kept.
#   2. FORWARD SPAWN HEADING  (heading.start_heading: bearing_to_goal +
#      start_heading_noise_deg: 15). Robot spawns pointed at the goal side +/-15
#      deg, instead of uniform-random. Removes the ~50% "spawned facing backward"
#      reorientation nuisance -> easier. LEAK-FREE: the goal bearing is the same
#      for both aisles (both reach the same open-zone goal), so it never reveals
#      which aisle is sealed — that stays exclusively in the CCTV.
#
# Run: build_2x3.py --counterfactual --config <this> --tag cfv2fwd --date 2026-07-04
#   -> scenes warehouse_2x3_0900+ , runs_root warehouse_2x3_cfv2fwd_2026-07-04 ,
#      exp data_gen_2x3_cfv2fwd_p* , manifest datagen_2x3_cfv2fwd_manifest.json
#   (the --tag keeps this campaign fully separate from the first cf campaign).
# ============================================================================

n_envs: 600             # (unused in --counterfactual mode; kept for schema parity)
base_seed: 7000
partition_size: 10      # scenes per experiment yaml (< ~20 Isaac env-reload-leak threshold)
max_steps: 250

zones:
  start: [A, D, G]
  goal:  [A, D, G]
  rules: [no_adjacent]

blocking:
  mode: route_aware
  blocked_fraction: 0.5
  route_aisle_min_pts: 3
  lam: 0.405
  max: 4

# --- counterfactual campaign knobs -----------------------------------------
counterfactual:
  target_trajectories: 300   # 2026-07-04: 300 (was 600 in the first cf campaign) -> ~250 train
                             # after a 5:1:1-style base split; ~5 h data-gen on the (flaky) box.
  base_seed: 11000           # fresh seed range (first cf used 9000, legacy 7000 — no overlap)
  name_start_index: 900      # bases warehouse_2x3_0900+ (first cf used 0600-0827 — no collision)
  min_transit_aisles: 1
  aisle_distractor_count_probs: [1.0]  # NO distractors in aisle zones (v2 change)

robot:
  inflation_m: 0.35

astar_config: warehouse_2x3

object_pools:
  aisle:
    blockers:
      - { kind: forklift, variant: 0, yaw_across: true }  # 3.49 m across -> A* gate seals the aisle
    distractors:
      - { kind: box,    variant: 0 }
      - { kind: barrel, variant: 0 }
      - { kind: crate,  variant: 0 }
  open:
    blockers: []
    distractors:
      - { kind: box,    variant: 0 }
      - { kind: cart,   variant: 0 }
      - { kind: barrel, variant: 0 }

# --- distractors OFF (v2 change) --------------------------------------------
distractors:
  count_probs: [1.0]        # P(0 distractors) = 1.0 -> zero distractors placed anywhere
  yaw_random: true

placement:
  point_margin_m: 0.8
  start_goal_clearance_m: 0.6
  blocker_end_margin_m: 1.0
  distractor_clearance_pad_m: 0.1
  max_tries: 50
  solvable_retries: 8

# --- heading: FORWARD toward goal + noise (v2 change) -----------------------
heading:
  start_heading: bearing_to_goal   # point at the goal (was 'random')
  start_heading_noise_deg: 15.0    # +/- uniform noise around the goal bearing (NEW knob;
                                   # 0.0 = exact bearing). Leak-free — bearing is aisle-agnostic.
  start_heading_mode: fixed        # baked as a literal the env uses verbatim (NEVER 'astar')
  goal_heading_mode: deleaked      # NOT WIRED; goal de-leak hardcoded (goal_yaw_deg=0.0)

lighting: [normal]
stats:
  detour_threshold: 1.15
