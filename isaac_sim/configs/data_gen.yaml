# ============================================================================
# OmniVLA Isaac Sim training-data generation — top-level Hydra config
# ============================================================================
#
# Consumed by:  isaac_sim/eval/new_server_client/data_gen.py
#
# Structural parallel to eval.yaml — same config groups, same `runs:` list
# pattern, same compose-with-overrides per-run mechanism. The differences:
#
#   • policy:   astar_oracle_nobrake  (path-following oracle, not a VLA; no arrival brake)
#   • recorder: data_gen      (separate runs_root + emits frames.json /
#                              astar_path.json via DataGenRecorder)
#
# Everything else (task, env/scene, env/robot, env/camera_set, env/astar,
# controller) is shared with the eval pipeline. That's deliberate: the
# oracle should see the exact same world the VLA sees so the recorded
# rollouts are in-distribution for downstream training.
#
# Launch examples:
#   python data_gen.py                                         # uses defaults
#   python data_gen.py env/scene=template3_medium              # single override
#   python data_gen.py +experiment=data_gen_pose_template1_easy  # one-flag run
# ============================================================================

defaults:
  - policy: astar_oracle_nobrake       # A* oracle, NO arrival brake — DEFAULT training-data regime (full speed to goal; arrival handled downstream by the stop token). Override to astar_oracle for braked data.
  - task: pose                         # pose-goal mode; A* doesn't need lang/image
  - env/scene: warehouse_2x3          # mounts scene fields at cfg.env.*
  - env/robot: nova_carter                  # mounts at cfg.env.robot
  - env/camera_set: default            # mounts selected cams at cfg.env.cameras.*
  - env/astar: default                 # mounts A* planner knobs at cfg.env.astar
  - controller: data_gen_default       # 30 Hz control loop (dt_s = 1/30), 3 Hz recording
  - recorder: data_gen                 # data-gen-specific recorder (frames.json etc.)
  - viz: default                       # all viz cosmetics (cfg.viz.*) — single source
  - _self_                             # values below win over the included files

# Planning viz draws the A* path as the SUBJECT (no rollout to compare against),
# so override the shared default's dashed-reference style to solid + node dots.
viz:
  path_map:
    astar_linestyle: "-"

# ---------------------------------------------------------------------------
# Run identity
# ---------------------------------------------------------------------------
# Human-readable descriptor — becomes the run-dir name under recorder.runs_root.
# Convention: YYYY-MM-DD_<scenario>_datagen_<vN>. Bump the version when re-
# running after a code or config change so each run dir is unique.
run:
  name: "2026-05-23_datagen_t1easy_v0"
  notes: ""           # free-text — surfaces in metadata for posterity

# Put Hydra's per-invocation working dir INSIDE this dataset's own output dir under
# runs/ (recorder.runs_root is always set via `recorder: data_gen`), so the
# resolved-config snapshot (.hydra/) + hydra log sit WITH the generated data —
# never accumulating in the code tree. See runs/README → Housekeeping.
hydra:
  searchpath:
    - pkg://isaac_sim.configs._generated
  run:
    dir: ${recorder.runs_root}/_hydra/${now:%Y-%m-%d_%H-%M-%S}

# Sample cadence (training-data sample rate). MUST match eval.yaml's record_hz
# — it's paper-pinned to 3 Hz by the action-chunk tokenisation.
record_hz: 3.0
# Inner control-loop rate. Faster than record_hz so (v, w) updates between
# recorded samples, approximating real-robot deployment (low-level controller
# runs much faster than data sampling). control_hz must be an integer
# multiple of record_hz for clean decimation.
control_hz: 30.0

# Inner PhysX integrator rate — sets World(physics_dt = 1 / physics_hz) and the
# steps_per_control decimation. NOT a tuning knob: 60 Hz is the Isaac Sim
# default, and changing it would require re-validating PhysX behaviour under
# the trained dynamics. Single source of truth (replaces the old helper/
# constants.py); isaac_sim_env + data_gen derive physics_dt from it. Kept
# identical to eval.yaml's physics_hz.
physics_hz: 60

# ---------------------------------------------------------------------------
# Run list — one entry per closed-loop oracle rollout.
# ---------------------------------------------------------------------------
# Each `runs[i]` is composed against the defaults above via:
#     run_cfg = compose("data_gen", overrides=[task=..., env_scene=..., ...])
# so a run can override any field group without touching the top-level defaults.
#
# `action` controls reuse of policy/env across consecutive runs to amortise
# the expensive SimulationApp boot. Values mirror data_gen.py's Action enum:
#   RELOAD    — recreate task + env + policy from scratch
#   KEEP_ENV  — keep IsaacSimEnv, recreate task + policy (env_scene override forbidden)
runs:
  - name: smoke_2x3
    env_scene: warehouse_2x3
    action: RELOAD
