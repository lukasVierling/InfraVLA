# ============================================================================
# 2x3 warehouse cf data-gen — v2 "FORWARD-HEADING, NO-DISTRACTOR" TEST SET.
# ============================================================================
# HELD-OUT test scenes for the cfv2fwd avgpool64 run (2026-07-04). Byte-identical
# rules to datagen_2x3_v2_fwd.yaml (forward heading +/-15 deg, NO distractors,
# forklift blockers kept, route-aware seal, A* gate) with ONLY the three knobs
# that make it a disjoint held-out set changed:
#
#   target_trajectories 300 -> 50   (50 test scene-variants; whole families kept)
#   name_start_index    900 -> 1100 (bases warehouse_2x3_1100+ ; train used
#                                     900-~990, val 991-1010, old cf 600-827 -> no
#                                     collision)
#   base_seed         11000 -> 20000 (fresh seed range; train consumed ~11000-12200)
#
# Run: build_2x3.py --counterfactual --config <this> --tag cfv2fwdtest --date 2026-07-04
#   -> scenes warehouse_2x3_1100+ (scene yamls only; NO rollout data-gen needed —
#      closed-loop eval reads the scene configs directly).
# ============================================================================

n_envs: 600             # (unused in --counterfactual mode; kept for schema parity)
base_seed: 7000
partition_size: 10      # scenes per experiment yaml (< ~20 Isaac env-reload-leak threshold)
max_steps: 250

zones:
  start: [A, D, G]
  goal:  [A, D, G]
  rules: [no_adjacent]

blocking:
  mode: route_aware
  blocked_fraction: 0.5
  route_aisle_min_pts: 3
  lam: 0.405
  max: 4

# --- counterfactual campaign knobs -----------------------------------------
counterfactual:
  target_trajectories: 50    # HELD-OUT TEST: 50 scene-variants (was 300 in the train campaign)
  base_seed: 20000           # fresh seed range, disjoint from train (11000+) and val
  name_start_index: 1100     # bases warehouse_2x3_1100+ (disjoint from all prior scenes)
  min_transit_aisles: 1
  aisle_distractor_count_probs: [1.0]  # NO distractors in aisle zones (v2 rule)

robot:
  inflation_m: 0.35

astar_config: warehouse_2x3

object_pools:
  aisle:
    blockers:
      - { kind: forklift, variant: 0, yaw_across: true }  # 3.49 m across -> A* gate seals the aisle
    distractors:
      - { kind: box,    variant: 0 }
      - { kind: barrel, variant: 0 }
      - { kind: crate,  variant: 0 }
  open:
    blockers: []
    distractors:
      - { kind: box,    variant: 0 }
      - { kind: cart,   variant: 0 }
      - { kind: barrel, variant: 0 }

# --- distractors OFF (v2 rule) ----------------------------------------------
distractors:
  count_probs: [1.0]        # P(0 distractors) = 1.0 -> zero distractors placed anywhere
  yaw_random: true

placement:
  point_margin_m: 0.8
  start_goal_clearance_m: 0.6
  blocker_end_margin_m: 1.0
  distractor_clearance_pad_m: 0.1
  max_tries: 50
  solvable_retries: 8

# --- heading: FORWARD toward goal + noise (v2 rule) -------------------------
heading:
  start_heading: bearing_to_goal   # point at the goal (was 'random')
  start_heading_noise_deg: 15.0    # +/- uniform noise around the goal bearing (leak-free)
  start_heading_mode: fixed        # baked as a literal the env uses verbatim (NEVER 'astar')
  goal_heading_mode: deleaked      # NOT WIRED; goal de-leak hardcoded (goal_yaw_deg=0.0)

lighting: [normal]
stats:
  detour_threshold: 1.15
