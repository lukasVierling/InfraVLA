# Task: topological-graph goal (modality = {"image"} -> mode 6).
# OmniVLA's ">3 m" image-goal case: the goal is a topological graph of
# images recorded along the route.

name: image_graph
modality: ["image"]

lang_instruction: ""

goal_image_path: null
goal_graph_path: "isaac_sim/scouting/goal_graphs/goal_graph.json"

# Consumed by IsaacSimEnv.record_image_graph when bootstrapping the graph.
goal_graph_node_spacing_freq: 1.0
goal_graph_camera_name: front_cam
goal_graph_sampling_mode: static_arclength

goal_xy: null
goal_heading_deg: 0.0

# Timeout cap (see task/pose.yaml for the rationale).
max_steps: 100
success_dist: 0.3
