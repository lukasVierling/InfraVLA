# @package env.robot
# ============================================================================
# Robot: NVIDIA Nova Carter (Isaac Sim's current default mobile base)
# ============================================================================
#
# Mirror layout of carter.yaml — every field consumed by Robot() in robot.py
# and the camera/A* interpolations lives at the same key. Swap-in is
# `python eval_policy.py env/robot=nova_carter` (assuming a camera_set whose
# cameras live under the robot prim, which they do via ${env.robot.*}).
#
# Nova Carter is differential-drive (2 driven rear wheels + 2 passive front
# casters). The DifferentialController and WheeledRobot path is identical to
# Carter v1 — only the USD, wheel DOF names, and geometry differ.
#
# This is the robot used for data generation and evaluation in the 2x3
# warehouse experiments.
# ============================================================================

robot_name: "NovaCarter"
controller: "Differential"

# Stage path the robot is instantiated under. Used by camera auto-discovery
# (parent_prefix) and the A* map (obstacle exclude list) via interpolation.
prim_path: "/World/NovaCarter"

# USD asset path, relative to assets_root. Path is the Isaac Sim 5.x default
# location; verify with `omniverse://localhost/NVIDIA/Assets/Isaac/.../NovaCarter/`
# in the Nucleus browser if asset-root install layout differs.
usd_rel: "/Isaac/Robots/NVIDIA/NovaCarter/nova_carter.usd"

# Drive-wheel DOF names. Verify at first boot via the dof_names print in the
# env (server logs them at world.reset() time). The Isaac Sim 5.x Nova Carter
# typically exposes `joint_wheel_left` / `joint_wheel_right` for the driven
# rear wheels; if the USD changes naming, update here.
wheel_dof_names: ["joint_wheel_left", "joint_wheel_right"]

# Nova Carter physical geometry (from NVIDIA's spec sheet — re-measure from
# the USD if you ever doubt these):
#   wheel radius ~ 0.14 m
#   track width (between drive wheels) ~ 0.413 m
wheel_radius: 0.14
wheel_base: 0.413

# Chassis half-extent + safety buffer for A* obstacle inflation. Nova Carter
# chassis is ~0.415 m × 0.645 m (W × L) → max half-extent on the long axis
# ~0.32 m. 0.4 m here adds a small buffer to cover the sensor mast that sits
# above the chassis but extends laterally a touch, plus control slack.
# Single source of truth — env/astar/default.yaml interpolates this.
inflation_m: 0.35 #nova carter is 42cm wide and 65cm long

# Camera prim-discovery hints. Nova Carter ships 12 camera prims:
#   /World/NovaCarter/chassis_link/sensors/
#     front_hawk/{left,right}/camera_{left,right}   # narrow-FOV RGB stereo
#     back_hawk/{left,right}/camera_{left,right}
#     left_hawk/{left,right}/camera_{left,right}
#     right_hawk/{left,right}/camera_{left,right}
#     {front,back,left,right}_owl/camera            # fish-eye wide-angle RGB
#
# Policy view: use a single Hawk eye (narrow FOV). Owls are fish-eye and
# would feed the VLA out-of-distribution imagery. `front_hawk/left` is the unique substring that picks the left eye
# of the front-facing Hawk; uniqueness verified against the list above.
cameras:
  front_hints: ["front_hawk/left"]
  # Nova Carter has no built-in third-person chase camera, so these hints
  # fail auto-discovery with a clear error. Use a camera set without
  # carter_chase (e.g. default, with_4cctv_2x3*) or one with the synthetic
  # chase cam (with_cctv_synthetic_chase).
  chase_hints: ["chase_does_not_exist_on_nova_carter"]

initial_pos: null
initial_ori: null
