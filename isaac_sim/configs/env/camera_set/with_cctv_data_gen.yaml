# @package env.cameras
# ============================================================================
# Camera-set: ego front + carter chase + CCTV — data-gen naming
# ============================================================================
#
# Same three cameras as `with_cctv.yaml`, but mounted under keys that
# match what the training dataloader expects on disk:
#
#   env.cameras.front_cam     → frames/NNN.png  (renamed by DataGenRecorder)
#   env.cameras.chase_cam     → chase_cam/NNN.png  (not read by training; visual review only)
#   env.cameras.cctv          → cctv/NNN.png    (read by training when emit_cctv=True)
#
# Note the key `cctv:` instead of `cctv_topdown:` (which is what
# with_cctv.yaml uses). The DataGenRecorder writes one subdir per camera
# *key*; the training dataloader looks for the
# literal path `traj_dir/cctv`. So we rename at the camera_set level — same
# underlying camera config (cctv_topdown.yaml) just mounted under a
# different key.
#
# Use as:
#     python data_gen.py env/camera_set=with_cctv_data_gen
# ============================================================================

defaults:
  - /env/camera@front_cam: carter_front
  - /env/camera@chase_cam: carter_chase
  - /env/camera@cctv: cctv_topdown
