# @package env.cameras
# "Adjusted bigcam" 4-CCTV set for the 2x3 warehouse: ego front + four
# 16mm/24x24 CCTVs, each focused on its own part while the set still covers
# almost the entire warehouse. Used for the 2x3 data-gen and eval runs.
# Same camera names as with_4cctv_2x3, so downstream conventions are shared.
defaults:
  - /env/camera@front_cam: carter_front
  - /env/camera@cctv_NE: cctv_2x3_ne_bigcam
  - /env/camera@cctv_NW: cctv_2x3_nw_bigcam
  - /env/camera@cctv_SE: cctv_2x3_se_bigcam
  - /env/camera@cctv_SW: cctv_2x3_sw_bigcam
