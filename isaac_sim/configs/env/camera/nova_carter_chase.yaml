# ============================================================================
# Camera: synthetic behind-the-shoulder chase view for Nova Carter
# ============================================================================
#
# Nova Carter has no externally mounted camera prim, so this config creates
# a new camera prim under /World/NovaCarter/chassis_link that follows the
# robot. Visualisation only (not seen by the policy).
#
# Framing: behind and above the chassis origin, looking forward (+X chassis)
# and ~26.6 deg down, world +Z up in the image. USD's AddRotateXYZOp composes
# R = R_Z(rz) · R_Y(ry) · R_X(rx); solving for that view gives
# (rx, ry, rz) = (+63.43, 0, -90) deg. If you change the (x, z) offset,
# recompute rx = 90 - arctan(z / |x|) and keep it positive (negative rx tilts
# the camera up).
# ============================================================================

name: chase_cam

# Builder creates a new Camera prim at this path, parented under the
# robot's chassis link. No auto-discovery (the prim doesn't exist until it
# is created here). The path is Nova-Carter-specific.
prim_path: "/World/NovaCarter/chassis_link/synthetic_chase_cam"
auto_discover: null

# True => "place this camera ourselves" (CCTV-style branch in camera.py).
# The translate + rotate ops below are applied local to the prim's parent,
# which here is /World/NovaCarter/chassis_link — values are in chassis
# frame, not world frame (the "world_*" field names are kept for code-path
# parity with cctv_topdown, whose parent is /World).
translation_required: true

resolution: [1280, 720]
frequency: 10                       # visualization-only; matches CCTV cadence

logging: true

# Wider lens so the surrounding scene fits in frame from this chase
# distance. Same values as cctv_topdown.yaml for visual-style consistency.
intrinsics:
  focal_length_mm: 18.14756
  horizontal_aperture_mm: 20.955
  vertical_aperture_mm: 15.2908

# Chassis-frame offset + Euler (see header). Pitch arctan(2.5/5) = 26.57 deg;
# scale x and z together to widen the view without changing rx.
extrinsics:
  world_translate_m: [-5.0, 0.0, 2.5]
  world_rotate_euler_deg: [63.43, 0.0, -90.0]
