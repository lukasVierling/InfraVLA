# DAgger JUNCTION-ONLY N=30 arm, step_18000 (2026-08-25).
# Recovery data mined with anchor_mode=spawn (full episode from the scene's own
# spawn, so failures are the policy's OWN compounding error) and selected by
# excursion severity (peak >= 2.5 m = half the aisle pitch), NOT cf-window
# membership. Then filtered to the 30 MID-ROUTE junction failures: the other 18
# were late-route, 7 of them post-arrival drift (robot reached the goal, then
# wandered, and find_excursions has no arrival cutoff).
# step_18000 is the ONLY dagger-trained checkpoint to evaluate: this arm's
# best-VAL is the parent (recovery ft raises val loss), and val is not a valid
# selector here -- the wstart arm had better val (0.00646) and still failed 5/9
# cfBE closed-loop.
save_dir: "${recorder.runs_root}/${run.name}/policy"
cameras:
  - { obs_cam: front_cam, goal_frames: null, present: true }
  - { obs_cam: cctv_NE,   goal_frames: null, present: true }
  - { obs_cam: cctv_NW,   goal_frames: null, present: true }
  - { obs_cam: cctv_SE,   goal_frames: null, present: true }
  - { obs_cam: cctv_SW,   goal_frames: null, present: true }
use_cctv_goal: false
no_goal_image: false
inference:
  resume: true
  vla_path: "${oc.env:INFRAVLA_ROOT}/omnivla-original"
  resume_step: 120000
  use_l1_regression: true
  use_diffusion: false
  use_film: false
  num_images_in_input: 6
  use_lora: true
  lora_rank: 32
  lora_dropout: 0.0
finetune:
  checkpoint_dir: "${oc.env:INFRAVLA_ROOT}/runs/training/runs/2026-08-25_holdout_E_CF_dagger_N30junction_ft18k_v0/checkpoints/step_18000"
  step: 18000
  use_cctv_encoder: true
  num_ego_images: 2
  cctv_downsample:
    method: avgpool
    out_tokens: 64
  cctv_cam_names: [cctv_NE, cctv_NW, cctv_SE, cctv_SW]
