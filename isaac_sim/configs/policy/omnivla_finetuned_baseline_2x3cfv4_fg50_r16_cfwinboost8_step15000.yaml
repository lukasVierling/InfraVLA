# Spatial task, ego-only baseline (no CCTV; front_cam, num_images=2): step_15000 of
# 2026-07-11_baseline_egoonly_2x3cfv4_r16_fg50_cfwinboost8_15k_v0.
# LoRA adapter is r16; inference.lora_rank 32 is the base-model placeholder.
save_dir: "${recorder.runs_root}/${run.name}/policy"
cur_image_cam_name: front_cam
inference:
  resume: true
  vla_path: "${oc.env:INFRAVLA_ROOT}/omnivla-original"
  resume_step: 120000
  use_l1_regression: true
  use_diffusion: false
  use_film: false
  num_images_in_input: 2
  use_lora: true
  lora_rank: 32
  lora_dropout: 0.0
finetune:
  checkpoint_dir: "${oc.env:INFRAVLA_ROOT}/runs/training/runs/2026-07-11_baseline_egoonly_2x3cfv4_r16_fg50_cfwinboost8_15k_v0/checkpoints/step_15000"
  step: 15000
