# ============================================================================
# Policy: A* path-following oracle — no-brake variant (training-data generator)
# ============================================================================
#
# arrival_distance_ratio = 0.0, so the expert drives full speed all the way to
# the goal and never decelerates. Used to generate brake-free trajectories:
# paired on the training side with the
# no-pad index cutoff (curr_time <= n - num_actions_chunk) and
# min_goal_distance_steps >= 1, so action labels are pure cruise with no
# padded terminal-stop steps and no goal=current contradiction.
#
# arrival_distance_ratio = 0.0 => arrival_distance_m = 0, so the braking
# branch in a_star_policy.py never fires (and its division by
# arrival_distance_m is never reached).
# ============================================================================

# Spacing (m) at which the A* path is densified for the path follower.
densify_spacing_m: 0.05

# No arrival deceleration — full speed to the goal. See header.
arrival_distance_ratio: 0.0
