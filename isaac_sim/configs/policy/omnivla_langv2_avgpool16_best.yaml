# Semantic task, ablation with CCTV pooling to 16 tokens per view: step_14000 of
# 2026-07-25_cctv4_avgpool16_langv2_yawcrux_pre3_v0.
# Evaluate with env/camera_set=with_4cctv_2x3_bigcam (set by the experiment shards).
save_dir: "${recorder.runs_root}/${run.name}/policy"
cameras:
  - { obs_cam: front_cam, goal_frames: null, present: true }
  - { obs_cam: cctv_NE,   goal_frames: null, present: true }
  - { obs_cam: cctv_NW,   goal_frames: null, present: true }
  - { obs_cam: cctv_SE,   goal_frames: null, present: true }
  - { obs_cam: cctv_SW,   goal_frames: null, present: true }
use_cctv_goal: false
no_goal_image: false
inference:
  resume: true
  vla_path: "${oc.env:INFRAVLA_ROOT}/omnivla-original"
  resume_step: 120000
  use_l1_regression: true
  use_diffusion: false
  use_film: false
  num_images_in_input: 6
  use_lora: true
  lora_rank: 32
  lora_dropout: 0.0
finetune:
  checkpoint_dir: "${oc.env:INFRAVLA_ROOT}/runs/training/runs/2026-07-25_cctv4_avgpool16_langv2_yawcrux_pre3_v0/checkpoints/step_14000"
  step: 14000
  use_cctv_encoder: true
  num_ego_images: 2
  # CCTV token downsampler: parameter-free avg-pool to out_tokens per view.
  cctv_downsample:
    method: avgpool
    out_tokens: 16
  cctv_cam_names: [cctv_NE, cctv_NW, cctv_SE, cctv_SW]
