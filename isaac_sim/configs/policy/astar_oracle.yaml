# ============================================================================
# Policy: A* path-following oracle (training-data generator)
# ============================================================================
#
# Consumed by A_star_policy(cfg.policy, cfg.controller, control_hz) in
# a_star_policy.py. The orchestration layer (data_gen.rollout) also reads
# `densify_spacing_m` to choose the arc-length spacing it passes into
# env.get_a_start_path() before handing the densified path to the policy.
#
# Most knobs are still derived rather than declared here:
#   • The A* path comes from the env (env.get_a_start_path()).
#   • The low-level (v, w) PD controller reuses the same block from
#     policy.py via cfg.controller.*.
#   • lookahead_m is DERIVED in a_star_policy.__init__ from
#     controller.max_linear_vel_mps, controller.waypoint_select, and the
#     paper-pinned VLA model sample rate (3 Hz) — see the constructor docstring.
# ============================================================================

# Arc-length spacing (m) the A* path is sampled at before being handed to
# pure-pursuit lookahead. 5 cm keeps the lookahead-target search well below
# the lookahead_m radius (derived to ~1.7 m at default speed), so the lookup
# walks over many candidate vertices before crossing the lookahead circle.
# Going finer doesn't improve smoothness once spacing << lookahead radius;
# it just adds search work per tick. Invariant: densify_spacing_m * 5 ≲
# lookahead_m — if you drop lookahead_m below ~25 cm (very tight maneuvers),
# drop this value with it. Matches the paper-adjacent value at
# scouting/oracle_scout.py:884.
densify_spacing_m: 0.05

# Arrival deceleration distance, in units of lookahead_m. Once the robot is
# within (arrival_distance_ratio × lookahead_m) of the goal, linear+angular
# speed ramp linearly to 0 at the goal (proportional brake) so recorded
# waypoints decelerate smoothly instead of stopping abruptly — otherwise the
# fine-tuned VLA can't learn the stop and overshoots (work-log 2026-05-31).
# 1.0: brake once the goal enters the lookahead radius (i.e. once the controller
# aims at the goal itself, not a forward path point). corral = lookahead_m ≈
# 1.67 m at 1 m/s — larger in distance than run1's 1.2 m (accounts for the 2×
# speed) but a slightly shorter decel time-constant. Gives an ~11-frame smooth
# ramp (far from the abrupt-stop cliff) while keeping most frames full-speed
# cruise: decel ≈17-25% of frames for typical paths (vs ~45% at ratio 2.0).
arrival_distance_ratio: 1.0
