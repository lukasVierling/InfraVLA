# ============================================================================
# OmniVLA Isaac Sim closed-loop evaluation — top-level Hydra config
# ============================================================================
#
# Consumed by:  isaac_sim/eval_policy.py
#
# One run = (policy, task, env) plus controller constants and the recorder.
# The `defaults:` list picks one option per config group; CLI overrides swap
# any of them, e.g.
#   python eval_policy.py task=image_graph env/camera_set=with_4cctv_2x3
# ============================================================================

defaults:
  - policy: omnivla_original
  - task: pose
  - env/scene: warehouse_2x3        # mounts scene fields at cfg.env.*
  - env/robot: nova_carter           # Nova Carter (Isaac Sim 5.x default)
  - env/camera_set: with_cctv_synthetic_chase  # synthetic chase prim parented
                                     # under /World/NovaCarter/chassis_link
                                     # (Nova Carter ships no chase prim)
  - env/astar: default               # mounts A* planner knobs at cfg.env.astar
  - controller: omnivla_default
  - recorder: default
  - viz: default                     # all viz cosmetics (cfg.viz.*) — single source
  - _self_                           # values below win over the included files

# ---------------------------------------------------------------------------
# Run identity
# ---------------------------------------------------------------------------
# Human-readable descriptor — becomes the run-dir name under recorder.runs_root.
# Convention: YYYY-MM-DD_<scenario>_<policy>_<vN>. Bump the version when re-
# running after a code or config change so each run dir is unique.
run:
  name: "2026-05-21_debug_pose_t1easy_v0"
  notes: ""           # free-text — goes into recorder's run metadata

# Put Hydra's per-invocation working dir INSIDE this run's own output dir under
# runs/ (recorder.runs_root is always set via `recorder: default`), so the
# resolved-config snapshot (.hydra/) + hydra log sit WITH the run's results —
# never accumulating in the code tree.
hydra:
  searchpath:
    - pkg://isaac_sim.configs._generated
  run:
    dir: ${recorder.runs_root}/_hydra/${now:%Y-%m-%d_%H-%M-%S}

# Rate the VLA policy is queried at (= the rate it issues (v, w) commands).
# Paper-pinned to 3 Hz because action chunks are tokenised at 3 Hz; changing
# this requires retraining the action head.
#
# Single source of truth for waypoint_spacing and the policy's dt_s:
#     waypoint_spacing_m = max_linear_vel_mps / control_hz
#     dt_s               = 1 / control_hz
control_hz: 3.0

# Cadence at which the recorder saves frames + log rows. Independent of
# control_hz — recording is an I/O concern, not a control concern. In eval
# they happen to match (we save every inference step), but conceptually the
# recorder could subsample.
record_hz: 3.0

# Inner PhysX integrator rate — sets World(physics_dt = 1 / physics_hz) and,
# via record_hz, STEPS_PER_TICK. This is not a tuning knob: 60 Hz is the Isaac
# Sim default, and changing it would require re-validating PhysX behaviour
# under the trained dynamics. isaac_sim_env derives physics_dt from it.
# Kept identical to data_gen.yaml's physics_hz.
physics_hz: 60

# ---------------------------------------------------------------------------
# Fine-grained (decoupled) control for rollouts
# ---------------------------------------------------------------------------
# The VLA forward is slow (~200 ms) so it can only be queried at control_hz
# (3 Hz). The default loop collapses each prediction into one (v, w) held for
# 0.33 s, which can overshoot on heading-change scenes.
#
# When enabled, the VLA is still queried at control_hz to predict the waypoint
# chunk, and a high-rate follower (WaypointFollower) steers toward the predicted
# lookahead waypoint (chunk index waypoint_select) at `control_hz` below (30 Hz),
# recomputing (v, w) from the live pose every fast tick. The carrot is refreshed
# each ~3 Hz query. This high-rate recompute (mirroring data_gen.py's 30 Hz
# oracle loop) is what stops ω from staying pinned at the cap for a full 0.33 s.
#
# Disabled by default (single twist per query).
fine_grained:
  enabled: false
  # Follower tick rate. Mirrors data_gen.yaml's control_hz (30) so deploy-time
  # execution matches the data distribution. Must be an integer multiple of the
  # top-level control_hz (the model-query rate) for clean decimation.
  control_hz: 30

runs:
  # 2x3 warehouse smoke runs.
  - { name: "smoke_2x3_pose",  env_scene: warehouse_2x3, task: pose,        action: RELOAD }
  - { name: "smoke_2x3_graph", env_scene: warehouse_2x3, task: image_graph, action: RELOAD }
