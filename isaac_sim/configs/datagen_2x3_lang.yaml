# ============================================================================
# 2x3 warehouse LANGUAGE-goal data-gen — GENERATOR INPUT config.
# ============================================================================
# Read directly by run_builders/build_2x3_lang.py (OmegaConf.load). Separate
# from datagen_2x3.yaml (the forklift aisle-blocking / seal-counterfactual
# campaign) on purpose: this is the object-identity language task and shares
# NO generation code with it.
#
# Task: robot spawns in the cross-aisle D and must go to a NAMED object. One
# object per zone (except D), drawn without replacement so no kind ever repeats
# in a scene. Colour is NOT used — object KIND is the discriminator.
#
# Every behaviour-controlling literal lives here (no magic numbers in code).
# ============================================================================

# --- batch size -------------------------------------------------------------
n_families: 10             # twin FAMILIES to emit (2 scenes each: _tA + _tB).
                            # 125 -> 250 trajectories (campaign v1, Lukas 2026-07-20).
                            # Families 0000-0005 reuse the inspected seeds (same placements).
base_seed: 42000            # fresh seed range (cfv3 used 12000-15000)
name_start_index: 200         # families named warehouse_2x3_lang_0000+
partition_size: 8          # scenes per experiment yaml. Keep < ~20 (Isaac env-reload-leak
                            # threshold); lanes CHAIN partitions sequentially, each partition a
                            # fresh Isaac process so the leak resets. One instance = 5.2 GB VRAM.
max_steps: 120              # rollout cap ~36 m at ~3.3 record-steps/m; worst wall-spawn ->
                            # far A/G corner route pencils to ~34 m. Oracle terminates at
                            # arrival, so the cap is a pure safety net.

# --- object pool ------------------------------------------------------------
# The 5 target/distractor kinds. variant PINNED per kind (one look per noun so
# "the box" is always the same object). Variant choice = LARGEST measured
# variant of each kind, to maximise CCTV silhouette legibility (a guess).
pool:
  - { kind: forklift,     variant: 0 }   # half 0.61 x 1.75  (elongated; yaw=0 -> along aisle)
  - { kind: cart,         variant: 0 }   # half 0.47 x 0.82
  - { kind: barrel,       variant: 0 }   # half 0.30 x 0.35  (radius 0.46)
  - { kind: box,          variant: 0 }   # SM_CardBoxA_01, half 0.35 x 0.25 (radius 0.43). CLOSED box
                                          # (Lukas: not the open-flap one). v1=A_02 is the open variant
                                          # (13.5k vs 8.8k geometry; old GOAL_CATALOG also picked A_01).
  - { kind: traffic_cone, variant: 0 }   # S_TrafficCone.usd, footprint 0.3 (HAND value, not measured)

# --- footprint overrides (kinds with no MEASURED footprint) -----------------
# traffic_cone is a USD-payload asset measure_prop_footprints.py couldn't open,
# so it has no entry in measured_footprints.json. These are HAND values for a
# standard ~0.3 m-base cone (guess — flagged in the walkthrough). Only used for
# placement clearance; a wrong value just shifts how close a cone can sit to a
# rack, it does not affect the render's appearance.
footprint_overrides:
  traffic_cone:
    "0": { half_w: 0.15, half_d: 0.15, radius: 0.21 }

# --- zones ------------------------------------------------------------------
object_zones: [A, B, C, E, F, G]   # every zone EXCEPT D
spawn_zone: D                      # robot spawns in the cross-aisle
distractor_prob: 0.5               # P(place a distractor in a given non-goal object-zone)

# --- spawn pose -------------------------------------------------------------
# 'west_wall' (2026-07-19, Lukas): back against D's navigable west edge, facing
# EAST (0 deg) at the far wall — orthogonal to all four aisles, so the robot
# cannot peek into any aisle at spawn and must turn to commit (verified in the
# d_peek render: from here only rack ends + aisle mouths are visible).
spawn:
  mode: west_wall        # 'west_wall' | 'center'
  wall_buffer_m: 0.5     # clearance off the navigable edge (same 0.5 the d_peek probe used; A*-plannable)
  heading_deg: 0         # 0 = facing east (+x), orthogonal to the N-S aisles
  heading_mode: fixed

# --- placement geometry -----------------------------------------------------
placement:
  aisle_end_margin_m: 1.0    # keep an aisle object this far from the aisle's N/S ends
  open_margin_m: 0.8         # keep an open-zone (A/G) object this far from zone edges
  clearance_margin_m: 0.15   # extra static clearance beyond the object's own half-extent
  max_tries: 50              # rejection-sampling attempts per object

# --- language instruction ---------------------------------------------------
# instruction = pattern.format(x=phrase), pattern drawn uniformly PER SCENE
# (after all placement draws, so placements are seed-stable). Anchors:
#   "go to the {x}"        — authors' own edge example (run_omnivla_edge.py:436)
#   "move toward the {x}"  — LeLaN training template (lelan_dataset.py:433)
#   "navigate to the {x}"  — free third variant (our choice, flagged)
# Article "the" matches the edge example; LeLaN-side article unverified (no
# local data) — revisit if we ever inspect a real LeLaN pickle.
lang:
  patterns:
    - "go to the {x}"
    - "move toward the {x}"
    - "navigate to the {x}"
  phrases:              # kind -> human-readable object phrase (NOT the USD name)
    forklift: forklift
    cart: cart
    barrel: barrel
    box: box
    traffic_cone: traffic cone

# --- goal / target ----------------------------------------------------------
goal_clear_radius_m: 0.6     # recorded on the scene; reach-semantics decided later (see walkthrough)
forklift_aisle_yaw_deg: 0    # 0 = long axis ALONG the N-S aisle -> 1.22 m across, does NOT seal
lighting: [normal]

# --- robot + static map (for placement clearance only; no oracle here) ------
robot:
  inflation_m: 0.35          # nova_carter (data-gen default robot)
astar_config: warehouse_2x3  # static occupancy/SDF source (masks the gap behind the shelves)

# --- render (consumed by tools/render_lang_scenes.py) -----------------------
camera_set: with_4cctv_2x3_bigcam   # ego front + the 4 symmetric 16mm bigcam CCTVs (current)
