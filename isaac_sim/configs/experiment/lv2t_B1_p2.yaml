# @package _global_
# Closed-loop eval of omnivla_langv2_cctvfirst_best (policy: semantic CCTV-first ablation)
# on the semantic-task held-out test set (langv2test), shard 2/3.
defaults:
  - override /policy: omnivla_langv2_cctvfirst_best
  - override /task: lang
  - override /env/scene: warehouse_2x3_langv2_0504_tC
  - override /env/robot: nova_carter
  - override /env/camera_set: with_4cctv_2x3_bigcam
  - override /env/astar: warehouse_2x3
  - override /controller: omnivla_default
  - override /recorder: default
  - _self_
run: {name: "lv2t_B1_p2", notes: "semantic CCTV-first ablation, shard 2/3"}
control_hz: 3.0
record_hz: 3.0
fine_grained: {enabled: true, control_hz: 30}
task: {max_steps: 120, success_dist: 0.3}
env:
  cameras:
    cctv_NE: {logging: false}
    cctv_NW: {logging: false}
    cctv_SE: {logging: false}
    cctv_SW: {logging: false}
recorder: {runs_root: "${oc.env:INFRAVLA_ROOT}/runs/evaluation/sweeps/langv2test_paper/B1/lv2t_B1_p2"}
runs:
  - { name: "warehouse_2x3_langv2_0504_tC", env_scene: warehouse_2x3_langv2_0504_tC, lang_instruction: "move toward the traffic cone", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0504_tD", env_scene: warehouse_2x3_langv2_0504_tD, lang_instruction: "move toward the barrel", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0505_tA", env_scene: warehouse_2x3_langv2_0505_tA, lang_instruction: "move toward the barrel", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0505_tB", env_scene: warehouse_2x3_langv2_0505_tB, lang_instruction: "move toward the box", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0505_tC", env_scene: warehouse_2x3_langv2_0505_tC, lang_instruction: "move toward the traffic cone", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0505_tD", env_scene: warehouse_2x3_langv2_0505_tD, lang_instruction: "move toward the forklift", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0506_tA", env_scene: warehouse_2x3_langv2_0506_tA, lang_instruction: "move toward the forklift", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0506_tB", env_scene: warehouse_2x3_langv2_0506_tB, lang_instruction: "move toward the barrel", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0506_tC", env_scene: warehouse_2x3_langv2_0506_tC, lang_instruction: "move toward the box", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0506_tD", env_scene: warehouse_2x3_langv2_0506_tD, lang_instruction: "move toward the traffic cone", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0507_tA", env_scene: warehouse_2x3_langv2_0507_tA, lang_instruction: "move toward the traffic cone", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0507_tB", env_scene: warehouse_2x3_langv2_0507_tB, lang_instruction: "move toward the forklift", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0507_tC", env_scene: warehouse_2x3_langv2_0507_tC, lang_instruction: "move toward the barrel", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0507_tD", env_scene: warehouse_2x3_langv2_0507_tD, lang_instruction: "move toward the box", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0508_tA", env_scene: warehouse_2x3_langv2_0508_tA, lang_instruction: "move toward the box", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0508_tB", env_scene: warehouse_2x3_langv2_0508_tB, lang_instruction: "move toward the barrel", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0508_tC", env_scene: warehouse_2x3_langv2_0508_tC, lang_instruction: "move toward the forklift", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0508_tD", env_scene: warehouse_2x3_langv2_0508_tD, lang_instruction: "move toward the traffic cone", action: RELOAD }
