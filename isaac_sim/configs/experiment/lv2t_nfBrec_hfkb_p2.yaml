# @package _global_
# Closed-loop eval of omnivla_langv2_nfB_recovft_best (policy: semantic held-out placement, stage 2)
# on the semantic-task held-out placement scenes (forklift in aisle B), shard 2/7.
defaults:
  - override /policy: omnivla_langv2_nfB_recovft_best
  - override /task: lang
  - override /env/scene: warehouse_2x3_langv2_0029_tA
  - override /env/robot: nova_carter
  - override /env/camera_set: with_4cctv_2x3_bigcam
  - override /env/astar: warehouse_2x3
  - override /controller: omnivla_default
  - override /recorder: default
  - _self_
run: {name: "lv2t_nfBrec_hfkb_p2", notes: "semantic held-out placement, stage 2, shard 2/7"}
control_hz: 3.0
record_hz: 3.0
fine_grained: {enabled: true, control_hz: 30}
task: {max_steps: 120, success_dist: 0.3}
env:
  cameras:
    cctv_NE: {logging: false}
    cctv_NW: {logging: false}
    cctv_SE: {logging: false}
    cctv_SW: {logging: false}
recorder: {runs_root: "${oc.env:INFRAVLA_ROOT}/runs/evaluation/sweeps/langv2test_paper/nfBrec_hfkb/lv2t_nfBrec_hfkb_p2"}
runs:
