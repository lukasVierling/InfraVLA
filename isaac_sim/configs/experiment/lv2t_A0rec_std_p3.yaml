# @package _global_
# Closed-loop eval of omnivla_langv2_A0_recovft_best (policy: semantic stage 2 (InfraVLA))
# on the semantic-task held-out test set (langv2test), shard 3/3.
defaults:
  - override /policy: omnivla_langv2_A0_recovft_best
  - override /task: lang
  - override /env/scene: warehouse_2x3_langv2_0509_tA
  - override /env/robot: nova_carter
  - override /env/camera_set: with_4cctv_2x3_bigcam
  - override /env/astar: warehouse_2x3
  - override /controller: omnivla_default
  - override /recorder: default
  - _self_
run: {name: "lv2t_A0rec_std_p3", notes: "semantic stage 2 (InfraVLA), shard 3/3"}
control_hz: 3.0
record_hz: 3.0
fine_grained: {enabled: true, control_hz: 30}
task: {max_steps: 120, success_dist: 0.3}
env:
  cameras:
    cctv_NE: {logging: false}
    cctv_NW: {logging: false}
    cctv_SE: {logging: false}
    cctv_SW: {logging: false}
recorder: {runs_root: "${oc.env:INFRAVLA_ROOT}/runs/evaluation/sweeps/langv2_A0_recovft/std/lv2t_A0rec_std_p3"}
runs:
  - { name: "warehouse_2x3_langv2_0509_tA", env_scene: warehouse_2x3_langv2_0509_tA, lang_instruction: "move toward the box", action: RELOAD }
