# @package _global_
# S2 (cfwin ft, step_19500 = best val 0.0048) on the 23 gridES cells that the
# 2026-07-08 sweeps never covered (49/72 done). Completes the arm that isolates the
# recovery contribution as S3a - S2; without it that delta is confounded with the
# final_goal_prob 0.5->1.0 switch. Shard 2/2, run STRICTLY sequentially.
defaults:
  - override /policy: omnivla_finetuned_cctv4_2x3cfv4_avgpool64_cfwin_ft_step19500
  - override /task: pose
  - override /env/scene: warehouse_2x3_gridES_sR_gC_cfBE
  - override /env/robot: nova_carter
  - override /env/camera_set: with_4cctv_2x3_bigcam
  - override /env/astar: warehouse_2x3
  - override /controller: omnivla_default
  - override /recorder: default
run: {name: "eval_2x3_gridES_cfwin19500_missing_p2", notes: "S2 completion, shard 2/2."}
control_hz: 3.0
record_hz: 3.0
fine_grained: {enabled: true, control_hz: 30}
task: {max_steps: 300}
recorder: {runs_root: "${oc.env:INFRAVLA_ROOT}/runs/evaluation/sweeps/warehouse_2x3_gridES_2026-07-08/cfwin_ft19500_missing23", log_frames: true}
runs:
  - { name: "warehouse_2x3_gridES_sR_gC_cfBE__pose", env_scene: warehouse_2x3_gridES_sR_gC_cfBE, task: pose, policy: omnivla_finetuned_cctv4_2x3cfv4_avgpool64_cfwin_ft_step19500, action: RELOAD }
  - { name: "warehouse_2x3_gridES_sR_gC_cfBF__pose", env_scene: warehouse_2x3_gridES_sR_gC_cfBF, task: pose, action: KEEP_POLICY }
  - { name: "warehouse_2x3_gridES_sR_gC_cfC__pose", env_scene: warehouse_2x3_gridES_sR_gC_cfC, task: pose, action: KEEP_POLICY }
  - { name: "warehouse_2x3_gridES_sR_gC_cfCE__pose", env_scene: warehouse_2x3_gridES_sR_gC_cfCE, task: pose, action: KEEP_POLICY }
  - { name: "warehouse_2x3_gridES_sR_gR_cfB__pose", env_scene: warehouse_2x3_gridES_sR_gR_cfB, task: pose, action: KEEP_POLICY }
  - { name: "warehouse_2x3_gridES_sR_gR_cfBE__pose", env_scene: warehouse_2x3_gridES_sR_gR_cfBE, task: pose, action: KEEP_POLICY }
  - { name: "warehouse_2x3_gridES_sR_gR_cfBF__pose", env_scene: warehouse_2x3_gridES_sR_gR_cfBF, task: pose, action: KEEP_POLICY }
  - { name: "warehouse_2x3_gridES_sR_gR_cfC__pose", env_scene: warehouse_2x3_gridES_sR_gR_cfC, task: pose, action: KEEP_POLICY }
  - { name: "warehouse_2x3_gridES_sR_gR_cfCE__pose", env_scene: warehouse_2x3_gridES_sR_gR_cfCE, task: pose, action: KEEP_POLICY }
  - { name: "warehouse_2x3_gridES_sR_gR_cfE__pose", env_scene: warehouse_2x3_gridES_sR_gR_cfE, task: pose, action: KEEP_POLICY }
  - { name: "warehouse_2x3_gridES_sR_gR_cfF__pose", env_scene: warehouse_2x3_gridES_sR_gR_cfF, task: pose, action: KEEP_POLICY }
