# @package _global_
# Re-run of the 2 cells torn by an Isaac boot crash in the first pass
# (sC_gC/sC_gL cfCF — the hardest center-spawn cfCF cells). Single process.
defaults:
  - override /policy: omnivla_finetuned_cctv4_2x3cfv4_avgpool64_cfwin_obswap_step20000
  - override /task: pose
  - override /env/scene: warehouse_2x3_gridES_sC_gC_cfCF
  - override /env/robot: nova_carter
  - override /env/camera_set: with_4cctv_2x3_bigcam
  - override /env/astar: warehouse_2x3
  - override /controller: omnivla_default
  - override /recorder: default
run: {name: "eval_2x3_gridES_cfwin_obswap_step20000_fails_retry", notes: "boot-crash retry of the 2 center-spawn cfCF cells."}
control_hz: 3.0
record_hz: 3.0
fine_grained: {enabled: true, control_hz: 30}
task: {max_steps: 300}
recorder: {runs_root: "${oc.env:INFRAVLA_ROOT}/runs/evaluation/sweeps/warehouse_2x3_gridES_2026-07-08/cfwin_obswap_step20000_avgpoolfails", log_frames: false}
runs:
  - { name: "warehouse_2x3_gridES_sC_gC_cfCF__pose", env_scene: warehouse_2x3_gridES_sC_gC_cfCF, task: pose, policy: omnivla_finetuned_cctv4_2x3cfv4_avgpool64_cfwin_obswap_step20000, action: RELOAD }
  - { name: "warehouse_2x3_gridES_sC_gL_cfCF__pose", env_scene: warehouse_2x3_gridES_sC_gL_cfCF, task: pose, action: KEEP_POLICY }
