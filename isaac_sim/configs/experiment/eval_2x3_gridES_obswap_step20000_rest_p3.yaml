# @package _global_
# obswap ft20k step_20000 — the 56 gridES cells NOT in the parent's 16-failure
# set (those are already evaluated in obswap_step20000_avgpoolfails). Together
# = full 72 regression check after the +5k diagonal-invisible-swap fine-tune.
# Shard 3/4.
defaults:
  - override /policy: omnivla_finetuned_cctv4_2x3cfv4_avgpool64_cfwin_obswap_step20000
  - override /task: pose
  - override /env/scene: warehouse_2x3_gridES_sC_gC_cfBF
  - override /env/robot: nova_carter
  - override /env/camera_set: with_4cctv_2x3_bigcam
  - override /env/astar: warehouse_2x3
  - override /controller: omnivla_default
  - override /recorder: default
run: {name: "eval_2x3_gridES_obswap_step20000_rest_p3", notes: "obswap step_20000, the 56 non-failure cells, shard 3/4."}
control_hz: 3.0
record_hz: 3.0
fine_grained: {enabled: true, control_hz: 30}
task: {max_steps: 300}
recorder: {runs_root: "${oc.env:INFRAVLA_ROOT}/runs/evaluation/sweeps/warehouse_2x3_gridES_2026-07-08/obswap_step20000_rest56", log_frames: false}
runs:
  - { name: "warehouse_2x3_gridES_sC_gC_cfBF__pose", env_scene: warehouse_2x3_gridES_sC_gC_cfBF, task: pose, policy: omnivla_finetuned_cctv4_2x3cfv4_avgpool64_cfwin_obswap_step20000, action: RELOAD }
  - { name: "warehouse_2x3_gridES_sC_gC_cfF__pose", env_scene: warehouse_2x3_gridES_sC_gC_cfF, task: pose, action: KEEP_POLICY }
  - { name: "warehouse_2x3_gridES_sC_gL_cfC__pose", env_scene: warehouse_2x3_gridES_sC_gL_cfC, task: pose, action: KEEP_POLICY }
  - { name: "warehouse_2x3_gridES_sC_gR_cfB__pose", env_scene: warehouse_2x3_gridES_sC_gR_cfB, task: pose, action: KEEP_POLICY }
  - { name: "warehouse_2x3_gridES_sC_gR_cfCE__pose", env_scene: warehouse_2x3_gridES_sC_gR_cfCE, task: pose, action: KEEP_POLICY }
  - { name: "warehouse_2x3_gridES_sL_gC_cfBF__pose", env_scene: warehouse_2x3_gridES_sL_gC_cfBF, task: pose, action: KEEP_POLICY }
  - { name: "warehouse_2x3_gridES_sL_gL_cfB__pose", env_scene: warehouse_2x3_gridES_sL_gL_cfB, task: pose, action: KEEP_POLICY }
  - { name: "warehouse_2x3_gridES_sL_gL_cfE__pose", env_scene: warehouse_2x3_gridES_sL_gL_cfE, task: pose, action: KEEP_POLICY }
  - { name: "warehouse_2x3_gridES_sL_gR_cfC__pose", env_scene: warehouse_2x3_gridES_sL_gR_cfC, task: pose, action: KEEP_POLICY }
  - { name: "warehouse_2x3_gridES_sR_gC_cfBE__pose", env_scene: warehouse_2x3_gridES_sR_gC_cfBE, task: pose, action: KEEP_POLICY }
  - { name: "warehouse_2x3_gridES_sR_gC_cfE__pose", env_scene: warehouse_2x3_gridES_sR_gC_cfE, task: pose, action: KEEP_POLICY }
  - { name: "warehouse_2x3_gridES_sR_gL_cfC__pose", env_scene: warehouse_2x3_gridES_sR_gL_cfC, task: pose, action: KEEP_POLICY }
  - { name: "warehouse_2x3_gridES_sR_gR_cfBE__pose", env_scene: warehouse_2x3_gridES_sR_gR_cfBE, task: pose, action: KEEP_POLICY }
  - { name: "warehouse_2x3_gridES_sR_gR_cfE__pose", env_scene: warehouse_2x3_gridES_sR_gR_cfE, task: pose, action: KEEP_POLICY }
