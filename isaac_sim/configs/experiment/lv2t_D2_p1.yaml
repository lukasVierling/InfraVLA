# @package _global_
# Closed-loop eval of omnivla_langv2_frozenego_best (policy: semantic frozen-vision ablation)
# on the semantic-task held-out test set (langv2test), shard 1/3.
defaults:
  - override /policy: omnivla_langv2_frozenego_best
  - override /task: lang
  - override /env/scene: warehouse_2x3_langv2_0500_tA
  - override /env/robot: nova_carter
  - override /env/camera_set: with_4cctv_2x3_bigcam
  - override /env/astar: warehouse_2x3
  - override /controller: omnivla_default
  - override /recorder: default
  - _self_
run: {name: "lv2t_D2_p1", notes: "semantic frozen-vision ablation, shard 1/3"}
control_hz: 3.0
record_hz: 3.0
fine_grained: {enabled: true, control_hz: 30}
task: {max_steps: 120, success_dist: 0.3}
env:
  cameras:
    cctv_NE: {logging: false}
    cctv_NW: {logging: false}
    cctv_SE: {logging: false}
    cctv_SW: {logging: false}
recorder: {runs_root: "${oc.env:INFRAVLA_ROOT}/runs/evaluation/sweeps/langv2test_paper/D2/lv2t_D2_p1"}
runs:
  - { name: "warehouse_2x3_langv2_0500_tA", env_scene: warehouse_2x3_langv2_0500_tA, lang_instruction: "move toward the box", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0500_tB", env_scene: warehouse_2x3_langv2_0500_tB, lang_instruction: "move toward the forklift", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0500_tC", env_scene: warehouse_2x3_langv2_0500_tC, lang_instruction: "move toward the traffic cone", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0500_tD", env_scene: warehouse_2x3_langv2_0500_tD, lang_instruction: "move toward the barrel", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0501_tA", env_scene: warehouse_2x3_langv2_0501_tA, lang_instruction: "move toward the barrel", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0501_tB", env_scene: warehouse_2x3_langv2_0501_tB, lang_instruction: "move toward the box", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0501_tC", env_scene: warehouse_2x3_langv2_0501_tC, lang_instruction: "move toward the forklift", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0501_tD", env_scene: warehouse_2x3_langv2_0501_tD, lang_instruction: "move toward the traffic cone", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0502_tA", env_scene: warehouse_2x3_langv2_0502_tA, lang_instruction: "move toward the traffic cone", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0502_tB", env_scene: warehouse_2x3_langv2_0502_tB, lang_instruction: "move toward the box", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0502_tC", env_scene: warehouse_2x3_langv2_0502_tC, lang_instruction: "move toward the forklift", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0502_tD", env_scene: warehouse_2x3_langv2_0502_tD, lang_instruction: "move toward the barrel", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0503_tA", env_scene: warehouse_2x3_langv2_0503_tA, lang_instruction: "move toward the box", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0503_tB", env_scene: warehouse_2x3_langv2_0503_tB, lang_instruction: "move toward the barrel", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0503_tC", env_scene: warehouse_2x3_langv2_0503_tC, lang_instruction: "move toward the forklift", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0503_tD", env_scene: warehouse_2x3_langv2_0503_tD, lang_instruction: "move toward the traffic cone", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0504_tA", env_scene: warehouse_2x3_langv2_0504_tA, lang_instruction: "move toward the box", action: RELOAD }
