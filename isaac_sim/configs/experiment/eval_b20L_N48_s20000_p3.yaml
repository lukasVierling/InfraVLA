# @package _global_
# b20 ladder N=48 @ step_20000, shard 3/3. log_frames FALSE
# (frames are ~81 MB/rollout and filled the disk on 2026-08-14; SR needs only
# result.json + log.jsonl).
defaults:
  - override /policy: omnivla_b20ladder_N48_step20000
  - override /task: pose
  - override /env/scene: warehouse_2x3_gridES_sC_gC_cfBF
  - override /env/robot: nova_carter
  - override /env/camera_set: with_4cctv_2x3_bigcam
  - override /env/astar: warehouse_2x3
  - override /controller: omnivla_default
  - override /recorder: default
run: {name: "eval_b20L_N48_s20000_p3", notes: "unified-recipe ladder"}
control_hz: 3.0
record_hz: 3.0
fine_grained: {enabled: true, control_hz: 30}
task: {max_steps: 300}
recorder: {runs_root: "${oc.env:INFRAVLA_ROOT}/runs/evaluation/sweeps/warehouse_2x3_gridES_2026-08-13/b20ladder_N48_step20000", log_frames: false}
runs:
