  - { name: "warehouse_2x3_langv2_0064_tB", env_scene: warehouse_2x3_langv2_0064_tB, lang_instruction: "move toward the safety cone", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0055_tB", env_scene: warehouse_2x3_langv2_0055_tB, lang_instruction: "move toward the safety cone", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0043_tB", env_scene: warehouse_2x3_langv2_0043_tB, lang_instruction: "move toward the safety cone", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0148_tC", env_scene: warehouse_2x3_langv2_0148_tC, lang_instruction: "move toward the safety cone", action: RELOAD }
  - { name: "warehouse_2x3_langv2_0500_tC", env_scene: warehouse_2x3_langv2_0500_tC, lang_instruction: "move toward the safety cone", action: RELOAD }
