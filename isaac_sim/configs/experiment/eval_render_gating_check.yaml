# @package _global_
# RENDER-GATING EQUIVALENCE CHECK (2026-07-13). One short rollout with frames
# SAVED, run twice:
#   ISAAC_RENDER_EVERY_TICK=1  -> legacy: RTX render on every physics tick
#   (default)                  -> gated: render ONLY on the tick we read back
# The frames must be pixel-identical. If the gated path returns a STALE frame
# (Isaac's render pipeline is latent), the observation the policy sees is one
# control step behind -> every eval and data-gen run would be silently wrong.
# Uses the CCTV camera set so all 5 cameras (ego + 4x720x720 CCTV) are exercised.
defaults:
  - override /policy: omnivla_finetuned_cctv4_2x3cfv4_avgpool64_cfwinboost8_step15000
  - override /task: pose
  - override /env/scene: warehouse_2x3_gridES_sC_gC_cfB
  - override /env/robot: nova_carter
  - override /env/camera_set: with_4cctv_2x3_bigcam
  - override /env/astar: warehouse_2x3
  - override /controller: omnivla_default
  - override /recorder: default
run: {name: "eval_render_gating_check", notes: "render-gating frame-equivalence check"}
control_hz: 3.0
record_hz: 3.0
fine_grained: {enabled: true, control_hz: 30}
task: {max_steps: 20}                 # short — we only need a handful of frames
recorder: {runs_root: "${oc.env:INFRAVLA_ROOT}/runs/evaluation/sweeps/_render_check", log_frames: true}
runs:
  - { name: "gating__pose", env_scene: warehouse_2x3_gridES_sC_gC_cfB, task: pose, policy: omnivla_finetuned_cctv4_2x3cfv4_avgpool64_cfwinboost8_step15000, action: RELOAD }
