# ============================================================================
# 2x3 warehouse LANGUAGE-goal data-gen v2 — GENERATOR INPUT config.
# ============================================================================
# Read directly by run_builders/build_2x3_lang.py (OmegaConf.load). v2 delta vs
# datagen_2x3_lang.yaml (v1, kept untouched so v1 stays reproducible):
#   - family_mode: one_per_aisle — ALWAYS one object in EACH of the 4 aisles
#     (no distractor_prob draw; every scene contains all 4 kinds).
#   - object_zones: aisles only (B/C/E/F) — no open-zone (A/G) objects.
#   - placement.aisle_band: outer_half — objects sit in the CCTV-side half of
#     their aisle (north half of B/C, south half of E/F): close to the bigcam,
#     far from D, so the target cannot leak into the onboard view at spawn
#     (Lukas 2026-07-22).
#   - pool: 4 kinds, cart DROPPED (Lukas 2026-07-22).
#   - 4 rollouts per family: every placed object is the target of one twin
#     scene (tA..tD share placements byte-for-byte, differ only in
#     role flags + goal_xy + instruction). 150 families -> 600 trajectories.
#
# Every behaviour-controlling literal lives here (no magic numbers in code).
# ============================================================================

# --- batch size -------------------------------------------------------------
n_families: 150             # 150 families x 4 twins = 600 trajectories
                            # (campaign v2, Lukas 2026-07-22).
base_seed: 43000            # fresh seed range (v1 used 42000+, cfv3 12000-15000)
name_prefix: warehouse_2x3_langv2   # scene names langv2_0000_tA.. — cannot
                            # collide with the v1 warehouse_2x3_lang_* scenes
name_start_index: 0
partition_size: 8           # 2 families per experiment yaml (8 % 4 == 0 keeps a
                            # family's twins in one partition). Keep < ~20
                            # (Isaac env-reload-leak threshold).
max_steps: 120              # unchanged from v1; aisle-only targets are nearer
                            # than v1's worst A/G corner, so a pure safety net.

# --- family structure -------------------------------------------------------
family_mode: one_per_aisle  # 'goal_plus_distractors' (v1) | 'one_per_aisle':
                            # shuffle the pool over object_zones (one kind per
                            # aisle, len(pool) MUST == len(object_zones)) and
                            # emit one twin per placed object as target.

# --- object pool ------------------------------------------------------------
# The 4 target kinds (cart dropped for v2). variant PINNED per kind, same
# largest-variant choices as v1 (one look per noun).
pool:
  - { kind: forklift,     variant: 0 }   # half 0.61 x 1.75  (yaw=0 -> along aisle)
  - { kind: barrel,       variant: 0 }   # half 0.30 x 0.35  (radius 0.46)
  - { kind: box,          variant: 0 }   # SM_CardBoxA_01 (closed), half 0.35 x 0.25
  - { kind: traffic_cone, variant: 0 }   # S_TrafficCone.usd, footprint HAND value

# --- footprint overrides (kinds with no MEASURED footprint) -----------------
# Same hand values as v1 (see datagen_2x3_lang.yaml for the rationale).
footprint_overrides:
  traffic_cone:
    "0": { half_w: 0.15, half_d: 0.15, radius: 0.21 }

# --- zones ------------------------------------------------------------------
object_zones: [B, C, E, F]  # the 4 aisles ONLY (order = twin order tA..tD)
spawn_zone: D               # robot spawns in the cross-aisle
# distractor_prob intentionally ABSENT: unused in one_per_aisle mode.

# --- spawn pose (unchanged from v1) -----------------------------------------
spawn:
  mode: west_wall
  wall_buffer_m: 0.5
  heading_deg: 0
  heading_mode: fixed

# --- placement geometry -----------------------------------------------------
placement:
  aisle_band: outer_half     # 'full' (v1) | 'outer_half': y restricted to the
                             # aisle half FARTHER from D = closer to that
                             # aisle's bigcam (B/C keep the north half,
                             # E/F the south half).
  aisle_end_margin_m: 1.0    # keep an aisle object this far from the aisle's N/S ends
  clearance_margin_m: 0.15   # extra static clearance beyond the object's own half-extent
  max_tries: 50              # rejection-sampling attempts per object
  # open_margin_m intentionally ABSENT: no open-zone placements in v2.

# --- language instruction (unchanged from v1, cart phrase dropped) ----------
lang:
  patterns:
    - "go to the {x}"
    - "move toward the {x}"
    - "navigate to the {x}"
  phrases:
    forklift: forklift
    barrel: barrel
    box: box
    traffic_cone: traffic cone

# --- goal / target (unchanged from v1) --------------------------------------
goal_clear_radius_m: 0.6
forklift_aisle_yaw_deg: 0    # long axis ALONG the aisle -> does NOT seal it
lighting: [normal]

# --- robot + static map (for placement clearance only; no oracle here) ------
robot:
  inflation_m: 0.35
astar_config: warehouse_2x3

# --- render (consumed by tools/render_lang_scenes.py) -----------------------
camera_set: with_4cctv_2x3_bigcam
