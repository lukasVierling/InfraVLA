# ============================================================================
# Counterfactual recovery-data collection — top-level Hydra config
# ============================================================================
#
# Consumed by:  isaac_sim/recovery/recovery.py  (offline pipeline; see its header)
#
# The env group below is a placeholder: recovery.py replaces run_cfg.env per
# scene with the source trajectory's stored env config (the exact sealed
# world). Everything else (model policy, oracle policy, controller, task,
# recorder, rates) comes from here.
#
# Launch (Isaac python, like eval_policy):
#   /isaacsim/python.sh isaac_sim/recovery/recovery.py \
#       recovery.split_dir=... recovery.output_root=... recovery.quota=25
# ============================================================================

defaults:
  - policy: omnivla_finetuned_cctv4_2x3cfv4_avgpool64_cfwinboost8_step15000  # the model being mined — set per campaign
  - policy@policy_oracle: astar_oracle_nobrake     # the recovery-label expert (clean A*)
  - task: pose
  - env/scene: warehouse_2x3                      # placeholder — replaced per scene
  - env/robot: nova_carter
  - env/camera_set: default                        # placeholder — replaced per scene
  - env/astar: default
  - controller: data_gen_default                   # 30 Hz control / 3 Hz record
  - recorder: data_gen                             # runs_root overridden to recovery.output_root
  - viz: default
  - _self_

# Write the per-run rollout_viz.png so every mined rollout can be inspected
# (recorder/data_gen.yaml leaves path_viz disabled).
recorder:
  path_viz:
    enabled: true

# Confirmation rollouts must run the same control stack as the evals of the
# checkpoint being mined; a mismatched follower creates failure modes the
# deployed stack does not have.
fine_grained:
  enabled: false
  control_hz: 30       # follower rate when enabled (eval-shard convention)

recovery:
  # Train split only — recovery data becomes training data.
  split_dir: "${oc.env:INFRAVLA_ROOT}/runs/data/splits/2026-07-11_warehouse_2x3_cfv4/train"
  output_root: "${oc.env:INFRAVLA_ROOT}/runs/data/recovery/UNNAMED"   # set per campaign
  # Stop after this many reached recovery runs (quota sampling over randomly
  # ordered scenes).
  quota: 25
  # Sharding for parallel processes (launch_recovery_shards.sh): each process
  # takes permutation[shard::n_shards] of the same seeded sample order —
  # disjoint by construction, no coordination needed.
  shard: 0
  n_shards: 1
  # Hard cap on confirmation rollouts (safety net if the failure rate is
  # near zero and the quota would never fill).
  max_rollouts: 200
  seed: 0

  # ---- cf samples (the dataset's own window definition, mine_cf_windows
  # with the standard knobs) ----
  n_chunk: 8               # = num_actions_chunk (training contract)
  window_pre_steps: 16
  window_post_steps: 8
  # Window definition must match the training-side cf_window_balance:
  # distance = 16/8/0.75; yaw = last frame before the twins' headings split.
  criterion: distance      # distance | yaw
  yaw_eps_deg: 1.0         # only used when criterion=yaw

  # ---- Model rollout ----
  # Which frame of each cf window the model rollout spawns at.
  #   random       — every window frame is a candidate
  #   window_start — one probe per trajectory at the window's earliest frame
  #   spawn        — one full rollout per trajectory from the scene's own spawn
  #                  (budget = factor * route length); every threshold
  #                  excursion is segmented and selected by
  #                  min_excursion_peak_m (below)
  anchor_mode: random

  # Budget = factor * the cf snippet's remaining length. min_rollout_steps
  # floors the budget (one chunk) for samples near the snippet end.
  budget_factor: 1.0
  min_rollout_steps: 8

  # ---- Derailment check (recovery_analysis.find_derailment) ----
  # dev_thresh_m defines the cf windows above (training-side contract);
  # rollout_dev_thresh_m is the derailment verdict on model rollouts (clean
  # tracking peaks ~0.19 m, failure wobbles start ~0.49 m).
  dev_thresh_m: 0.75
  rollout_dev_thresh_m: 0.5   # catch the failure cluster, skip small tracking slop
  sustain_steps: 1         # 1 = off (any single step over threshold derails)
  aligned_eps_m: 0.05
  # Recoveries per derailment, spawns drawn without replacement from the
  # [last_aligned, onset] band (capped by band width). The band carries the
  # scarce initiate-the-correction supervision.
  n_spawns: 2

  # ---- Which excursions are worth mining (anchor_mode=spawn only) ----
  # Acceptance threshold on an excursion's peak deviation. Distinct from
  # rollout_dev_thresh_m, the detection threshold (where an excursion starts
  # and the oracle-spawn band ends): detection stays tight so recoveries begin
  # early, acceptance decides whether the mistake was real.
  # 2.5 m = half the 4.96 m aisle pitch, i.e. the robot ended up nearer the
  # wrong aisle's centreline than its own route; empirically this also
  # separates excursions the policy fixes itself from ones it never rejoins.
  # 0.0 disables the filter (mine every detected excursion).
  min_excursion_peak_m: 2.5

  # ---- Replay / measurement mode ----
  # replay_manifest: path to an earlier campaign's recovery_manifest.json —
  # roll exactly its derailed (scene, t) states instead of random samples.
  # measure_only: verdict + manifest only — no oracle run, no stitching.
  # rerecord_source_root: unused; kept so older campaign configs compose.
  rerecord_source_root: null
  replay_manifest: null
  measure_only: false
  keep_rollouts: false     # measure_only: archive rollouts under output_root/rollouts/

  # ---- Oracle recovery runs ----
  # Recovery follows the original route to the original goal; the cap is
  # sized to the longest source trajectories (~150 frames) + slack.
  # Non-reaching runs are filtered (no stitch).
  oracle_max_record_steps: 250   # cap per run (task.max_steps for the oracle)
  # Oracle PD tick rate (data_gen semantics: fast inner loop between 3 Hz
  # records). Separate from the top-level control_hz, which follows eval
  # semantics (= model query rate) because the confirmation rollout reuses
  # eval_policy's loops.
  oracle_control_hz: 30.0

run:
  name: "recovery_collection"
  notes: ""

hydra:
  searchpath:
    - pkg://isaac_sim.configs._generated
  run:
    dir: ${recovery.output_root}/_hydra/${now:%Y-%m-%d_%H-%M-%S}

# Eval semantics (the confirmation rollout reuses eval_policy's loops):
# control_hz = model query rate (3 Hz) — the 30 Hz inner rates live in
# fine_grained.control_hz (follower) and recovery.oracle_control_hz.
record_hz: 3.0
control_hz: 3.0
physics_hz: 60
